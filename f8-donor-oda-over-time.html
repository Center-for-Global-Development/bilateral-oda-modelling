<!doctype html>
<html lang="en" data-cgd-interactive-name="oda-f8-donor-oda-over-time">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How a recipient's donor mix changes over time</title>
<link rel="stylesheet" href="shared/cgd-figure.css"><link rel="stylesheet" href="shared/cgd-responsive.css"><link rel="stylesheet" href="shared/oda-figure.css">
<style>
  .area-wrap{width:100%;min-height:330px}.area-wrap svg{display:block;width:100%}.donor-legend{display:flex;gap:7px 12px;flex-wrap:wrap;font-size:11.5px}
  /* Deliberately tiny: this decides how the legend beside it is populated, so it
     belongs with the legend rather than in the control bank above, where it
     would read as another data filter. */
  .donor-scope{justify-self:end}.donor-scope button{font-size:10.5px;padding:3px 7px;min-height:24px;white-space:nowrap}
  /* Below 620px the header becomes one column and the toggle drops under the
     legend. Sharing a row with a nine-key donor legend at phone width left the
     toggle's column too narrow for "Top 8", so both labels were clipped. */
  @media(max-width:620px){.panel-header{grid-template-columns:minmax(0,1fr)}.donor-scope{justify-self:start}}.legend-key{display:inline-flex;gap:4px;align-items:center}.legend-swatch{width:11px;height:10px}.tooltip{position:absolute;z-index:20;max-width:285px}.short-select{min-width:180px}
  @media(max-width:520px){.area-wrap{min-height:300px}}
</style></head>
<body><main id="vizRoot" class="viz-wrapper"><div class="header-row"><div class="title-block"><h1>How a recipient's donor mix changes over time</h1></div><button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="View fullscreen" title="View fullscreen"><svg class="icon-expand" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5" stroke="currentColor" stroke-width="1.8"/></svg><svg class="icon-compress" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
  <div class="controls" id="controls"></div><section class="panel"><div class="panel-header"><div class="donor-legend" id="legend"></div><div class="segmented donor-scope" id="donorScope" role="group" aria-label="Donors shown"></div></div><div class="chart-area" id="chartArea"><div class="area-wrap"><svg id="areaSvg" role="img" aria-labelledby="vizTitle"></svg></div></div></section><div id="notes"></div><div class="tooltip" id="tooltip" hidden></div></main>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous" referrerpolicy="no-referrer"></script><script src="shared/dom.js"></script><script src="shared/chart-core.js"></script><script src="shared/set-config.js"></script><script src="shared/oda-payload.js"></script><script src="shared/oda-model.js"></script><script src="shared/oda-ui.js"></script>
<script>
(async()=>{'use strict';
  window.CGD_READY = false;const{element}=window.CGDDom,C=window.CGDCore,P=window.ODAPayload,M=window.ODAModel,UI=window.ODAUI;const root=document.getElementById('vizRoot'),chartArea=document.getElementById('chartArea');let payload;
  try{payload=await P.load();if(!window.d3)throw new Error('The pinned chart dependency did not load.');}catch(error){P.renderFailState(chartArea,error); window.CGD_READY = true;return;}
  const years=M.displayYears(payload),OTHER='OTHER',defaultRecipient=payload.axes.recipient.includes('AFG')?'AFG':payload.axes.recipient[0];
  const state=UI.createState({scenario:'S1',measure:'gross',recipient:defaultRecipient,sector:'ALL',unit:'usd',allDonors:false},{onChange:()=>schedule()});
  const recipientSelect=element('select',{className:'plain-select'});for(const iso of payload.axes.recipient.slice().sort((a,b)=>payload.recipientName(a).localeCompare(payload.recipientName(b))))recipientSelect.append(element('option',{text:payload.recipientName(iso),attributes:{value:iso}}));recipientSelect.value=state.get().recipient;recipientSelect.addEventListener('change',()=>state.set({recipient:recipientSelect.value}));
  const sectorSelect=element('select',{className:'plain-select'});sectorSelect.append(element('option',{text:'All sectors',attributes:{value:'ALL'}}));for(const code of M.sectorsAlphabetical(payload))sectorSelect.append(element('option',{text:payload.sectorName(code),attributes:{value:String(code)}}));sectorSelect.addEventListener('change',()=>state.set({sector:sectorSelect.value}));
  const unitBox=element('div',{className:'segmented',attributes:{role:'group','aria-label':'Display unit'}});for(const[v,l,aria]of[['usd','US$','Show US dollars'],['pct','% ODA','Show share of recipient ODA']]){const b=element('button',{text:l,attributes:{type:'button','data-unit':v,'aria-label':aria}});b.addEventListener('click',()=>state.set({unit:v}));unitBox.append(b);}state.subscribe(s=>{recipientSelect.value=s.recipient;sectorSelect.value=s.sector;unitBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.unit===s.unit)));});
  const pair=element('div',{className:'oda-pair'},[UI.controlGroup('Show',unitBox,{id:'unitControl'}),UI.measureToggle(state,s=>s.unit)]);
  document.getElementById('controls').append(UI.scenarioSelect(state),UI.controlGroup('Recipient',recipientSelect,{id:'recipientSelect',extraClass:'short-select'}),UI.controlGroup('Sector',sectorSelect,{id:'sectorSelect',extraClass:'short-select'}),pair);unitBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.unit===state.get().unit)));
  /* Top eight plus Other is the default because nine bands is about the limit
     for distinguishable fills. But it hides which donors are in the remainder,
     and for a recipient with a long tail that is most of them -- so the reader
     can ask for all of them and take the colour collisions that come with it. */
  const scopeBox=document.getElementById('donorScope');
  for(const[v,l,aria]of[[false,'Top 8','Show the eight largest donors and group the rest as Other'],
                        [true,'All','Show every donor with funding in this selection, each with its own colour']]){
    const b=element('button',{text:l,attributes:{type:'button','data-all':String(v),title:aria,'aria-label':aria}});
    b.addEventListener('click',()=>state.set({allDonors:v}));scopeBox.append(b);
  }
  function syncScope(st){scopeBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.all===String(st.allDonors))));}
  state.subscribe(syncScope);syncScope(state.get());

  async function allSectorSeries(s){await payload.blobs(M.seriesBlobNames('donor_recipient',s));return Object.fromEntries(payload.axes.donor.map(donor=>[donor,years.map(year=>M.valueAt(payload,'donor_recipient',{...s,year},{donor,recipient:s.recipient}))]));}
  async function sectorSeries(s){const out=Object.fromEntries(payload.axes.donor.map(d=>[d,years.map(()=>0)]));for(let i=0;i<years.length;i++){const cells=await M.cubeCells(payload,{scenario:s.scenario,measure:s.measure,year:years[i],recipient:s.recipient,sector:s.sector});for(const r of cells)out[r.donor][i]+=r.value;}return out;}
  async function buildData(s){const series=s.sector==='ALL'?await allSectorSeries(s):await sectorSeries(s),totals=payload.axes.donor.map(code=>({code,total:series[code].reduce((a,b)=>a+b,0)})).sort((a,b)=>b.total-a.total),
    /* With `allDonors` every donor that funds this selection at all is its own
       band and there is no Other, so `top` is the whole active set and the
       remainder sums to nothing. Donors with no funding are still left out:
       a zero-height band is not information, it is just another legend key. */
    top=s.allDonors?totals.filter(d=>d.total>0).map(d=>d.code):totals.slice(0,8).map(d=>d.code),
    keys=s.allDonors?[...top]:[...top,OTHER],data=years.map((year,i)=>{const row={year};for(const code of top)row[code]=series[code][i];if(!s.allDonors)row[OTHER]=payload.axes.donor.filter(d=>!top.includes(d)).reduce((a,d)=>a+series[d][i],0);row.total=keys.reduce((a,k)=>a+row[k],0);if(s.unit==='pct'&&row.total>0)for(const k of keys)row[k]/=row.total;return row;});return{series,top,keys,data,totals};}
  /* Nine stacked bands must be nine distinguishable fills. Assigned across the
     whole key set rather than hashed per donor, which previously collided four
     times in nine bands — including the United Kingdom against Other. */
  let palette=new Map();
  const colour=code=>palette.get(String(code))||window.CGDSet.RESIDUAL,svg=d3.select('#areaSvg'),tooltip=document.getElementById('tooltip');let lastWidth=700,seq=0,pinned=null;
  function showTip(code,year,model,target){const i=years.indexOf(year),raw=model.series[code]?.[i],annual=payload.axes.donor.map(d=>({d,v:model.series[d][i]})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v),rank=code===OTHER?null:annual.findIndex(r=>r.d===code)+1,total=annual.reduce((a,b)=>a+b.v,0),value=code===OTHER?model.data[i][OTHER]*(state.get().unit==='pct'?total:1):raw,share=total>0?value/total:0;tooltip.replaceChildren(element('strong',{text:code===OTHER?'Other donors':payload.donorName(code)}),element('div',{text:String(year)}),element('div',{text:M.usd(value)}),element('div',{text:`${M.percent(share,{decimals:1})} of recipient ODA`}),rank?element('div',{text:`Rank: ${rank} of ${annual.length} active donors`}):element('div',{text:'Combined remainder after the top eight donors'}));tooltip.hidden=false;const b=target.getBoundingClientRect(),rb=root.getBoundingClientRect();tooltip.style.left=`${Math.min(rb.width-tooltip.offsetWidth-8,Math.max(8,b.left-rb.left+10))}px`;tooltip.style.top=`${Math.max(8,b.top-rb.top+10)}px`;}
  function draw(model,s,width){lastWidth=width;/* In All mode there can be forty bands, and CGDSet.assignColours draws from a
     finite house ramp -- it gave 38 donors 17 fills, so pairs of bands touching
     each other could share a colour and read as one band. The house palette is
     used for as many donors as it can distinguish, and the remainder take
     generated hues so that no two bands are ever the same fill.

     This is a legibility floor, not a claim that forty colours are individually
     identifiable: at this band count colour is a separator, and the tooltip and
     the legend are what actually name a donor. */
  const housePalette=window.CGDSet.assignColours(model.keys,model.keys.includes(OTHER)?{residual:[OTHER]}:{});
  palette=housePalette;
  if(model.keys.length>9){
    const used=new Set(),unique=new Map();
    model.keys.forEach((code,i)=>{
      const house=housePalette.get(String(code));
      if(code===OTHER){unique.set(String(code),house||window.CGDSet.RESIDUAL);return}
      if(house&&!used.has(house)){used.add(house);unique.set(String(code),house);return}
      /* Golden-angle hue steps, so successive fallbacks are far apart on the
         wheel rather than adjacent; lightness alternates so two similar hues
         still differ in value for anyone who cannot separate them by hue. */
      let colour,guard=0;
      do{const hue=(i*137.508)%360,light=[38,52,66][(i+guard)%3];
        colour=`hsl(${Math.round((hue+guard*17)%360)} 46% ${light}%)`;guard+=1;}
      while(used.has(colour)&&guard<60);
      used.add(colour);unique.set(String(code),colour);
    });
    palette=unique;
  }const height=Math.max(300,Math.min(455,Math.round(width*.58))),margin={top:12,right:12,bottom:44,left:width<=520?58:70},plotW=width-margin.left-margin.right,plotH=height-margin.top-margin.bottom,x=d3.scaleLinear().domain([2024,2028]).range([margin.left,margin.left+plotW]),max=s.unit==='pct'?1:d3.max(model.data,d=>d.total)||1,y=d3.scaleLinear().domain([0,max]).nice().range([margin.top+plotH,margin.top]),stack=d3.stack().keys(model.keys)(model.data),area=d3.area().x(d=>x(d.data.year)).y0(d=>y(d[0])).y1(d=>y(d[1])).curve(d3.curveMonotoneX);svg.attr('viewBox',`0 0 ${width} ${height}`).attr('height',height).selectAll('*').remove();svg.append('g').attr('transform',`translate(0,${margin.top+plotH})`).call(d3.axisBottom(x).tickValues(years).tickFormat(d3.format('d')).tickSizeOuter(0)).selectAll('text').attr('class','axis');const yTicks=y.ticks(width<=520?3:5);svg.append('g').attr('transform',`translate(${margin.left},0)`).call(d3.axisLeft(y).tickValues(yTicks).tickFormat(v=>s.unit==='pct'?d3.format('.0%')(v):(width<=520?(v>=1000?`${Math.round(v/1000)}bn`:`${Math.round(v)}m`):M.usd(v))).tickSize(-plotW).tickSizeOuter(0)).call(g=>g.select('.domain').remove()).selectAll('text').attr('class','axis');svg.selectAll('path.band').data(stack).join('path').attr('class','band').attr('d',area).attr('fill',d=>colour(d.key)).attr('tabindex',0).attr('role','img').attr('aria-label',d=>d.key===OTHER?'Other donors':payload.donorName(d.key)).on('pointermove',function(e,d){const year=Math.max(2024,Math.min(2028,Math.round(x.invert(d3.pointer(e,svg.node())[0]))));showTip(d.key,year,model,this);}).on('pointerleave',()=>{if(!pinned)tooltip.hidden=true;}).on('focus',function(e,d){showTip(d.key,2028,model,this);}).on('blur',()=>{if(!pinned)tooltip.hidden=true;}).on('click',function(e,d){e.stopPropagation();pinned=d.key;const year=Math.max(2024,Math.min(2028,Math.round(x.invert(d3.pointer(e,svg.node())[0]))));showTip(d.key,year,model,this);UI.attachDismiss(tooltip,()=>{pinned=null;tooltip.hidden=true;},{returnFocusTo:this});});svg.append('text').attr('class','axis-title').attr('x',margin.left+plotW/2).attr('y',height-5).attr('text-anchor','middle').text('Year');svg.append('text').attr('class','axis-title').attr('x',margin.left).attr('y',10).text(s.unit==='pct'?'Share of recipient bilateral ODA':'Bilateral ODA, constant 2024 US$');const legend=document.getElementById('legend');legend.replaceChildren();for(const code of model.keys){const sw=element('span',{className:'legend-swatch'});sw.style.background=colour(code);legend.append(element('span',{className:'legend-key'},[sw,element('span',{text:code===OTHER?'Other':payload.donorName(code)})]));}/* Neither the subtitle nor the summary line said anything the controls, the
     legend and the notes did not already say. */window.CGD_READY=true;}
  async function schedule(){const n=++seq,s={...state.get()};tooltip.hidden=true;try{const model=await buildData(s);if(n!==seq)return;draw(model,s,lastWidth);window.ODA_F8.lastModel=model;}catch(error){if(n===seq)P.renderFailState(chartArea,error); window.CGD_READY = true;}}
  document.getElementById('notes').append(UI.notes({notes:[(state.get().allDonors?'Every donor funding the selected recipient and sector is shown.':'The eight largest donors for the selected recipient and sector are shown; every other donor is grouped as Other. Switch the legend control to All to see them individually.'),UI.STANDARD_NOTES.prices]}));C.observeInlineSize(document.querySelector('.area-wrap'),w=>{lastWidth=w;schedule();});document.getElementById('fullscreenBtn').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():root.requestFullscreen?.());window.ODA_F8={state,buildData:()=>buildData(state.get())};
})();
</script><script src="shared/cgd-embed.js"></script></body></html>
