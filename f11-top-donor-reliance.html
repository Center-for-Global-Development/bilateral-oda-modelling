<!doctype html><html lang="en" data-cgd-interactive-name="oda-f11-top-donor-reliance"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Most recipients lean on a single donor, and still will</title><link rel="stylesheet" href="shared/cgd-figure.css?v=20260902b"><link rel="stylesheet" href="shared/cgd-responsive.css?v=20260902b"><link rel="stylesheet" href="shared/oda-figure.css?v=20260902b"><style>

</style></head><body><main id="vizRoot" class="viz-wrapper"><div class="header-row"><div class="title-block"><h1>Most recipients lean on a single donor, and still will</h1><p class="viz-sub" id="sub"></p></div><button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="View fullscreen" title="View fullscreen"><svg class="icon-expand" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5" stroke="currentColor" stroke-width="1.8"/></svg><svg class="icon-compress" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" stroke="currentColor" stroke-width="1.8"/></svg></button></div><div class="controls" id="controls"></div><section class="panel"><div class="panel-header"><div class="legend" id="legend"></div></div><div class="chart-area"><div class="plot-wrap"><svg id="chart" role="img" aria-label="Top donor share in 2024 compared with 2028"></svg></div></div></section><div id="notes"></div><div class="tooltip" id="tooltip" hidden></div><div id="popupHost"></div></main>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous" referrerpolicy="no-referrer"></script><script src="shared/dom.js?v=20260902b"></script><script src="shared/chart-core.js?v=20260902b"></script><script src="shared/set-config.js?v=20260902b"></script><script src="shared/oda-payload.js?v=20260902b"></script><script src="shared/oda-model.js?v=20260902b"></script><script src="shared/oda-ui.js?v=20260902b"></script><script>
(async()=>{'use strict';window.CGD_READY=false;const{element}=CGDDom,C=CGDCore,P=ODAPayload,M=ODAModel,UI=ODAUI,host=document.getElementById('popupHost');let payload;try{payload=await P.load();if(!d3)throw Error('The pinned chart dependency did not load.')}catch(e){P.renderFailState(document.querySelector('.panel'),e);window.CGD_READY=true;return}
const sectors=payload.axes.sector.slice().sort((a,b)=>payload.sectorName(a).localeCompare(payload.sectorName(b))),recipients=payload.axes.recipient.slice().sort((a,b)=>payload.recipientName(a).localeCompare(payload.recipientName(b)));
/* Humanitarian aid is the opening sector rather than the first alphabetically.
   It is the sector where concentration on a single donor matters most, and the
   one the paper leads on; "Agriculture, forestry and fishing" was the default
   only because it sorts first. Looked up by code rather than by position, so
   re-sorting the list cannot silently change the default. */
const HUMANITARIAN=sectors.find(code=>String(code)==='700')??sectors[0];
const state=UI.createState({scenario:'S1',view:'sector',selected:HUMANITARIAN,hiddenIncome:''},{dependents:{view:['selected']},onChange:()=>schedule()});
const view=element('select',{className:'plain-select'});[['sector','Sector view'],['recipient','Recipient view']].forEach(o=>view.append(new Option(o[1],o[0])));const selected=element('select',{className:'plain-select oda-select-wide'});view.onchange=()=>state.set({view:view.value,selected:view.value==='sector'?sectors[0]:recipients[0]});selected.onchange=()=>state.set({selected:selected.value});document.getElementById('controls').append(UI.scenarioSelect(state),UI.controlGroup('View',view,{id:'viewSelect'}),UI.controlGroup('Show',selected,{id:'itemSelect'}));state.subscribe(syncControls);function syncControls(s){view.value=s.view;const values=s.view==='sector'?sectors:recipients;selected.replaceChildren(...values.map(v=>new Option(s.view==='sector'?payload.sectorName(v):payload.recipientName(v),v)));selected.value=s.selected}
let width=700,seq=0,rows=[],tip=document.getElementById('tooltip'),pinned=null;
function aggregate(cells,s,year){const pointKey=s.view==='sector'?'recipient':'sector',m=new Map();cells.forEach(c=>{const key=c[pointKey],r=m.get(key)||{key,total:0,donors:new Map()};r.total+=c.value;r.donors.set(c.donor,(r.donors.get(c.donor)||0)+c.value);m.set(key,r)});return new Map([...m].map(([k,r])=>{const top=[...r.donors].sort((a,b)=>b[1]-a[1])[0];return[k,{...r,year,share:r.total>0?top[1]/r.total:0,top:top?.[0]}]}))}
async function build(s){const filter=s.view==='sector'?{sector:s.selected}:{recipient:s.selected},[a,b]=await Promise.all([M.cubeCells(payload,{scenario:s.scenario,measure:'gross',year:2024,...filter}),M.cubeCells(payload,{scenario:s.scenario,measure:'gross',year:2028,...filter})]),aa=aggregate(a,s,2024),bb=aggregate(b,s,2028);const out=[];for(const key of new Set([...aa.keys(),...bb.keys()])){const x=aa.get(key),y=bb.get(key);if(!x||!y||!(x.total>0&&y.total>0))continue;out.push({key,x:x.share,y:y.share,a:x,b:y,name:s.view==='sector'?payload.recipientName(key):payload.sectorName(key),income:s.view==='sector'?M.incomeGroup(payload,key):null})}return out}
/* Sector view colours recipients by income group; recipient view colours each
   sector with its pinned CGD colour, which is distinct for all 21 sectors. */
function markColour(d,s){return s.view==='sector'?CGDSet.colourFor(d.income):CGDSet.sectorColour(d.key)}
function showTip(r,target){tip.replaceChildren(element('strong',{text:r.name}),element('div',{text:`2024: ${M.percent(r.x)} (${payload.donorName(r.a.top)})`}),element('div',{text:`2028: ${M.percent(r.y)} (${payload.donorName(r.b.top)})`}),element('div',{text:state.get().view==='sector'?`Income group: ${r.income}`:''}));tip.hidden=false;const b=target.getBoundingClientRect(),rb=document.getElementById('vizRoot').getBoundingClientRect();tip.style.left=`${Math.max(8,Math.min(rb.width-tip.offsetWidth-8,b.left-rb.left+8))}px`;tip.style.top=`${Math.max(8,b.top-rb.top+8)}px`}
function renderLegend(s){const l=document.getElementById('legend');if(s.view==='sector'){const present=M.INCOME_GROUPS.filter(g=>rows.some(r=>r.income===g));UI.filterLegend({host:l,keys:present,state,stateKey:'hiddenIncome',colourOf:g=>CGDSet.colourFor(g),tipOf:g=>{const n=rows.filter(r=>r.income===g).length;return `${n} recipient${n===1?'':'s'} in this group.`;}});return}l.replaceChildren();for(const k of rows.map(r=>r.key)){const sw=element('span',{className:'swatch'});sw.style.background=CGDSet.sectorColour(k);l.append(element('span',{className:'legend-item'},[sw,element('span',{text:payload.sectorName(k)})]))}}
function draw(s,w){/* Income groups switched off in the legend are dropped here, after `rows` is built, so the legend can still be rendered from the full set. Only the sector view is coloured by income group; the recipient view is coloured by sector and has no income dimension to filter. */const hiddenIncome=UI.hiddenSet(s.hiddenIncome),shown=s.view==='sector'?rows.filter(r=>!hiddenIncome.has(r.income)):rows;const h=Math.max(330,Math.min(470,Math.round(w*.62))),m={top:22,right:18,bottom:49,left:w<440?51:65},max=Math.max(.1,d3.max(shown,d=>Math.max(d.x,d.y))||.1)*1.08,x=d3.scaleLinear([0,max],[m.left,w-m.right]),y=d3.scaleLinear([0,max],[h-m.bottom,m.top]),svg=d3.select('#chart');svg.attr('viewBox',`0 0 ${w} ${h}`).attr('height',h).selectAll('*').remove();svg.append('g').attr('transform',`translate(0,${h-m.bottom})`).call(d3.axisBottom(x).ticks(w<440?4:6).tickFormat(d3.format('.0%')).tickSizeOuter(0));svg.append('g').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(y).ticks(w<440?4:6).tickFormat(d3.format('.0%')).tickSize(-(w-m.left-m.right))).call(g=>g.select('.domain').remove());svg.append('line').attr('x1',x(0)).attr('y1',y(0)).attr('x2',x(max)).attr('y2',y(max)).attr('stroke','#85A5AD');
svg.selectAll('circle.point').data(shown).join('circle').attr('class','point').attr('cx',d=>x(d.x)).attr('cy',d=>y(d.y)).attr('r',6).attr('fill',d=>markColour(d,s)).attr('fill-opacity',.8).attr('tabindex',0).attr('role','img').attr('aria-label',d=>`${d.name}: ${M.percent(d.x)} in 2024, ${M.percent(d.y)} in 2028`).on('pointerenter',function(e,d){showTip(d,this)}).on('pointerleave',()=>{if(!pinned)tip.hidden=true}).on('focus',function(e,d){showTip(d,this)}).on('blur',()=>{if(!pinned)tip.hidden=true}).on('click',function(e,d){e.stopPropagation();openPopup(d,s,this)}).on('keydown',function(e,d){if(e.key==='Enter'||e.key===' '){e.preventDefault();openPopup(d,s,this)}});
svg.append('text').attr('class','axis-title').attr('x',(m.left+w-m.right)/2).attr('y',h-5).attr('text-anchor','middle').text('Top bilateral donor share, 2024');svg.append('text').attr('class','axis-title').attr('x',m.left).attr('y',13).text('Top bilateral donor share, 2028');document.getElementById('sub').textContent=s.view==='sector'?`${payload.sectorName(s.selected)}: each dot is a recipient.`:`${payload.recipientName(s.selected)}: each dot is a sector.`;UI.renderNotes('notes',{visible:[`${shown.length} ${s.view==='sector'?'recipients':'sectors'} shown. Select a dot for donor contributions.`],notes:[
 'The top donor is re-identified in each year, so it may differ between 2024 and 2028.',
 UI.STANDARD_NOTES.prices
].filter(Boolean).filter(Boolean)});renderLegend(s);window.CGD_READY=true}
function openPopup(r,s,trigger){const dialog=UI.modal(r.name,{host,returnFocusTo:trigger});const donors=new Set([...r.a.donors.keys(),...r.b.donors.keys()]),list=[...donors].map(d=>({d,a:(r.a.donors.get(d)||0)/r.a.total,b:(r.b.donors.get(d)||0)/r.b.total})).sort((a,b)=>Math.max(b.a,b.b)-Math.max(a.a,a.b));
dialog.card.append(element('p',{className:'notes',text:'Each donor’s share of this cell’s bilateral ODA. Gold: 2024. Teal: 2028.'}),UI.trackAxis());
const body=element('div');dialog.card.append(body);
/* The two dots on each row carried no tooltip, so the only figures a reader
   could get out of the drill-down were the two percentages in the right-hand
   column -- and those do not say which dot is which, or by how much the donor
   moved. Each dot now names its year and its share, and the row label carries
   the donor name in full for a name the column has ellipsised. */
UI.pagedList(body,list,v=>{const track=element('div',{className:'oda-track'}),a=element('i',{className:'baseline'}),b=element('i');
  a.style.left=`calc(${Math.min(100,v.a*100)}% - 4px)`;b.style.left=`calc(${Math.min(100,v.b*100)}% - 4px)`;
  const name=payload.donorName(v.d),move=v.b-v.a;
  const shift=Math.abs(move)<0.0005?'no change':`${move>0?'up':'down'} ${M.percent(Math.abs(move),{decimals:1})}`;
  a.setAttribute('aria-label',`${name}, 2024: ${M.percent(v.a,{decimals:1})}`);
  b.setAttribute('aria-label',`${name}, 2028: ${M.percent(v.b,{decimals:1})}, ${shift}`);
  UI.hoverTip(a,`${name} — 2024: ${M.percent(v.a,{decimals:1})} of this cell.`);
  UI.hoverTip(b,`${name} — 2028: ${M.percent(v.b,{decimals:1})} of this cell (${shift} on 2024).`);
  track.append(a,b);
  const label=element('span',{className:'oda-rank-label',text:name});
  UI.hoverTip(label,`${name}: ${M.percent(v.a,{decimals:1})} in 2024, ${M.percent(v.b,{decimals:1})} in 2028 (${shift}).`);
  return element('div',{className:'oda-rank-row'},[label,track,element('small',{text:`${M.percent(v.a)} → ${M.percent(v.b)}`})])})}
async function schedule(){window.CGD_READY=false;const n=++seq,s={...state.get()};syncControls(s);try{const next=await build(s);if(n!==seq)return;rows=next;draw(s,width)}catch(e){if(n===seq){P.renderFailState(document.querySelector('.panel'),e);window.CGD_READY=true}}}

C.observeInlineSize(document.querySelector('.plot-wrap'),w=>{width=w;schedule()});document.getElementById('fullscreenBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.getElementById('vizRoot').requestFullscreen?.();window.ODA_F11={state,rows:()=>rows};})();
</script><script src="shared/cgd-embed.js?v=20260902b"></script></body></html>
