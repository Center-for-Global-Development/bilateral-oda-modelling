<!doctype html><html lang="en" data-cgd-interactive-name="oda-f10-orphaned-pairs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>‘Orphaned’ recipient-sector pairs, by year</title><link rel="stylesheet" href="shared/cgd-figure.css"><link rel="stylesheet" href="shared/cgd-responsive.css"><link rel="stylesheet" href="shared/oda-figure.css"><style>
  .plot-wrap{width:100%;min-height:330px}.plot-wrap svg{display:block;width:100%}
  .legend{display:flex;gap:8px 12px;flex-wrap:wrap}
  .plot-wrap{position:relative}.tooltip{position:absolute;z-index:20;max-width:260px}
</style></head><body><main id="vizRoot" class="viz-wrapper"><div class="header-row"><div class="title-block"><h1>‘Orphaned’ recipient-sector pairs, by year</h1><p class="viz-sub">A recipient-sector is counted as ‘orphaned’ once total bilateral ODA to it has fallen by a high proportion versus 2024.</p></div><button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="View fullscreen" title="View fullscreen"><svg class="icon-expand" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5" stroke="currentColor" stroke-width="1.8"/></svg><svg class="icon-compress" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" stroke="currentColor" stroke-width="1.8"/></svg></button></div><div class="controls" id="controls"></div><section class="panel"><div class="panel-header"><div class="legend" id="legend"></div></div><div class="chart-area"><div class="plot-wrap"><svg id="chart" role="img" aria-label="Cumulative count of ‘orphaned’ recipient-sector pairs from 2024 to 2028"></svg></div></div></section><p id="summary" class="notes"></p><div id="notes"></div><div class="tooltip" id="tooltip" hidden></div><div id="popupHost"></div></main>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous" referrerpolicy="no-referrer"></script><script src="shared/dom.js"></script><script src="shared/chart-core.js"></script><script src="shared/set-config.js"></script><script src="shared/oda-payload.js"></script><script src="shared/oda-model.js"></script><script src="shared/oda-ui.js"></script><script>
(async()=>{'use strict';window.CGD_READY=false;const{element}=CGDDom,C=CGDCore,P=ODAPayload,M=ODAModel,UI=ODAUI,host=document.getElementById('popupHost');let payload;try{payload=await P.load();if(!d3)throw Error('The pinned chart dependency did not load.');}catch(e){P.renderFailState(document.querySelector('.panel'),e);window.CGD_READY=true;return}
const years=M.displayYears(payload),groups={income:M.INCOME_GROUPS,sector:payload.axes.sector.slice().sort((a,b)=>payload.sectorName(a).localeCompare(payload.sectorName(b)))},state=UI.createState({scenario:'S1',threshold:.5,breakdown:'income'},{onChange:()=>schedule()});
function select(options,value,onchange,cls='plain-select'){const s=element('select',{className:cls});options.forEach(o=>s.append(element('option',{text:o[1],attributes:{value:o[0]}})));s.value=value;s.onchange=()=>onchange(s.value);return s}const threshold=select([['0.5','50%'],['0.75','75%']],'0.5',v=>state.set({threshold:+v})),breakdown=select([['income','Income group'],['sector','Sector']],state.get().breakdown,v=>state.set({breakdown:v}),'plain-select oda-select-wide');document.getElementById('controls').append(UI.scenarioSelect(state),UI.controlGroup('Cut threshold',threshold,{id:'thresholdSelect'}),UI.controlGroup('Break down by',breakdown,{id:'breakdownSelect'}));state.subscribe(s=>{threshold.value=String(s.threshold);breakdown.value=s.breakdown});
async function ensure(s){await payload.blobs(M.seriesBlobNames('recipient_sector',{scenario:s.scenario,measure:'gross'}))}
function allRows(s){const out=[];for(const recipient of payload.axes.recipient)for(const sector of payload.axes.sector){const base=M.valueAt(payload,'recipient_sector',{...s,year:2024,measure:'gross'},{recipient,sector});if(!(base>0))continue;out.push({recipient,sector,base,income:M.incomeGroup(payload,recipient),values:Object.fromEntries(years.map(year=>[year,M.valueAt(payload,'recipient_sector',{...s,year,measure:'gross'},{recipient,sector})||0]))})}return out}
/* CUMULATIVE, per the brief. A pair is counted from the first year its bilateral
   ODA has fallen by at least the threshold, and stays counted thereafter even if
   support partially recovers. `firstOrphanYear` is therefore the whole state a
   pair carries; recoveries are reported in the notes rather than silently
   removing a pair from the count. */
function crossesAt(r,y,s){return r.base>0&&(r.base-r.values[y])/r.base>=s.threshold}
function firstOrphanYear(r,s){for(const y of years)if(crossesAt(r,y,s))return y;return null}
function isOrphanBy(r,y,s){const f=firstOrphanYear(r,s);return f!==null&&f<=y}
function recoveredCount(s){return rows.filter(r=>{const f=firstOrphanYear(r,s);return f!==null&&years.some(y=>y>f&&!crossesAt(r,y,s))}).length}
function groupOf(r,s){return s.breakdown==='income'?r.income:String(r.sector)}
let rows=[],width=700,seq=0,palette=new Map();
function safeName(k){return groups.sector.map(String).includes(String(k))?payload.sectorName(k):k}
function renderLegend(keys){const l=document.getElementById('legend');l.replaceChildren();keys.forEach(k=>{const sw=element('span',{className:'swatch'});sw.style.background=palette.get(String(k));l.append(element('span',{className:'legend-item'},[sw,element('span',{text:safeName(k)})]))})}
function draw(s,w){const keys=groups[s.breakdown].filter(k=>rows.some(r=>groupOf(r,s)===String(k)));
/* One assignment across the whole key set, so no two bands share a fill and the
   residual "Not classified" keeps the recedent grey rather than the brightest
   colour on the chart. */
palette=CGDSet.assignColours(keys);
const data=years.map(year=>{const o={year};keys.forEach(k=>o[String(k)]=rows.filter(r=>groupOf(r,s)===String(k)&&isOrphanBy(r,year,s)).length);return o}),stackKeys=keys.map(String),stack=d3.stack().keys(stackKeys)(data),h=Math.max(310,Math.min(440,Math.round(w*.56))),m={top:18,right:18,bottom:46,left:w<430?48:58},x=d3.scalePoint(years,[m.left,w-m.right]).padding(.12),max=d3.max(data,d=>d3.sum(stackKeys,k=>d[k]))||1,y=d3.scaleLinear([0,max],[h-m.bottom,m.top]).nice(),area=d3.area().x(d=>x(d.data.year)).y0(d=>y(d[0])).y1(d=>y(d[1])).curve(d3.curveMonotoneX),svg=d3.select('#chart');svg.attr('viewBox',`0 0 ${w} ${h}`).attr('height',h).selectAll('*').remove();svg.append('g').attr('transform',`translate(0,${h-m.bottom})`).call(d3.axisBottom(x).tickSizeOuter(0));svg.append('g').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(y).ticks(w<430?4:6).tickSize(-(w-m.left-m.right))).call(g=>g.select('.domain').remove());
svg.selectAll('path.band').data(stack).join('path').attr('class','band').attr('d',area).attr('fill',d=>palette.get(String(d.key))).attr('fill-opacity',.85).style('cursor','pointer').attr('tabindex',0).attr('role','img').attr('aria-label',d=>`${safeName(d.key)}: ${d[d.length-1][1]-d[d.length-1][0]} ‘orphaned’ pairs by ${years[years.length-1]}. Select for the ranked pairs.`)/* The bands carried an aria-label and nothing else, so a sighted reader
   could see a shape and its colour but could not read a single number off it
   without opening the drill-down. The tooltip reports the band under the
   cursor at the YEAR under the cursor, which is the same year the click would
   drill into -- so what the reader is told and what they get are the same. */
.on('pointermove',function(e,d){const yr=yearAt(e,x,svg);showTip(d,yr,s,e)})
.on('pointerleave',()=>{document.getElementById('tooltip').hidden=true})
.on('focus',function(e,d){showTip(d,years[years.length-1],s,null,this)})
.on('blur',()=>{document.getElementById('tooltip').hidden=true})
.on('click',function(e,d){const yr=yearAt(e,x,svg);openPairs(d.key,yr,s,this)}).on('keydown',function(e,d){if(e.key==='Enter'||e.key===' '){e.preventDefault();openPairs(d.key,years[years.length-1],s,this)}});
svg.append('text').attr('x',(m.left+w-m.right)/2).attr('y',h-5).attr('text-anchor','middle').attr('class','axis-title').text('Year');svg.append('text').attr('x',m.left).attr('y',12).attr('class','axis-title').text('‘Orphaned’ pairs (cumulative count)');renderLegend(keys);document.getElementById('summary').textContent=`${max} recipient-sector pairs have been ‘orphaned’ at the ${Math.round(s.threshold*100)}% threshold by 2028. Select a band for the ranked pairs.`}
/* One definition of "which year is under the pointer", used by both the
   tooltip and the click, so they can never disagree. */
function yearAt(event,x,svg){const px=d3.pointer(event,svg.node())[0];
  return years.reduce((a,b)=>Math.abs(x(b)-px)<Math.abs(x(a)-px)?b:a)}
function showTip(d,year,s,event,node){
  const tip=document.getElementById('tooltip'),key=String(d.key),
    row=rows.filter(r=>groupOf(r,s)===key),
    count=row.filter(r=>isOrphanBy(r,year,s)).length,
    total=rows.filter(r=>isOrphanBy(r,year,s)).length;
  tip.replaceChildren(element('strong',{text:safeName(d.key)}),
    element('div',{text:`${year}: ${count} \u2018orphaned\u2019 pair${count===1?'':'s'}`}),
    element('div',{text:`${M.percent(total?count/total:0,{decimals:1})} of all orphaned pairs this year`}),
    element('div',{text:`${row.length} pair${row.length===1?'':'s'} in this group`}),
    element('div',{className:'tip-rule',text:'Select for the ranked pairs.'}));
  tip.hidden=false;
  const wrap=document.querySelector('.plot-wrap').getBoundingClientRect();
  let left,top;
  if(event){left=event.clientX-wrap.left+12;top=event.clientY-wrap.top+12;}
  else{const b=node.getBoundingClientRect();left=b.left-wrap.left+12;top=b.top-wrap.top+12;}
  tip.style.left=`${Math.max(4,Math.min(wrap.width-tip.offsetWidth-4,left))}px`;
  tip.style.top=`${Math.max(4,Math.min(wrap.height-tip.offsetHeight-4,top))}px`;
}
function openPairs(key,year,s,trigger){const matched=rows.filter(r=>groupOf(r,s)===String(key)&&isOrphanBy(r,year,s)).map(r=>({recipient:r.recipient,sector:r.sector,ratio:r.values[year]/r.base,base:r.base,lost:r.base-r.values[year]})).sort((a,b)=>a.ratio-b.ratio);UI.orphanDrilldown({payload,host,title:s.breakdown==='income'?`${safeName(key)} recipients’ ‘orphaned’ sectors by ${year}`:`‘Orphaned’ ${safeName(key)} pairs by ${year}`,pairs:matched,scenario:s.scenario,year,returnFocusTo:trigger})}
async function schedule(){window.CGD_READY=false;const n=++seq,s={...state.get()};try{await ensure(s);if(n!==seq)return;rows=allRows(s);draw(s,width);renderNotes(s);window.CGD_READY=true}catch(e){if(n===seq){P.renderFailState(document.querySelector('.panel'),e);window.CGD_READY=true}}}
function renderNotes(s){const recovered=recoveredCount(s);document.getElementById('notes').replaceChildren(UI.notes({notes:[
  'The count is cumulative: a pair is counted from the first year its bilateral ODA has fallen by at least the selected threshold, and stays counted in later years.',
  UI.STANDARD_NOTES.prices
].filter(Boolean).filter(Boolean)}))}
C.observeInlineSize(document.querySelector('.plot-wrap'),w=>{width=w;schedule()});document.getElementById('fullscreenBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.getElementById('vizRoot').requestFullscreen?.();window.ODA_F10={state,rows:()=>rows,firstOrphanYear,isOrphanBy};})();
</script><script src="shared/cgd-embed.js"></script></body></html>
