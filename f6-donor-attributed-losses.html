<body><main id="vizRoot" class="viz-wrapper">

<script src="shared/dom.js?v=20260902b"></script><script src="shared/chart-core.js?v=20260902b"></script><script src="shared/set-config.js?v=20260902b"></script><script src="shared/oda-payload.js?v=20260902b"></script><script src="shared/oda-model.js?v=20260902b"></script><script src="shared/oda-ui.js?v=20260902b"></script>
<script>
(async()=>{'use strict';
  window.CGD_READY = false;
  const{element,svgEl}=window.CGDDom,C=window.CGDCore,P=window.ODAPayload,M=window.ODAModel,UI=window.ODAUI;
  const root=document.getElementById('vizRoot'),chartArea=document.getElementById('chartArea');let payload;
  try{payload=await P.load();}catch(error){P.renderFailState(chartArea,error); window.CGD_READY = true;return;}
  const pageSize=10,OTHER='Other cutting donors';
  const OUTLIER_THRESHOLD=.5;
  const state=UI.createState({scenario:'S1',page:0,popupPage:0,selected:null,excludeOutliers:false},{dependents:{scenario:['page','popupPage'],excludeOutliers:['page']},onChange:()=>schedule()});
  await ensure(state.get());
  /* Whether the blobs the current scenario needs are actually in memory. The
     pager callbacks run on the state change, ahead of the load. */
  function scenarioReady(s){
    return M.seriesBlobNames('donor_recipient',{scenario:s.scenario,measure:'gross'})
      .every(n=>payload._blobs.has(n));
  }
  let lastPages=1,lastPopupPages=1;
  const controlsRow=document.getElementById('controls');
  controlsRow.prepend(UI.scenarioSelect(state));
  const mainPager=UI.pager(state,s2=>{if(!scenarioReady(s2))return lastPages;return lastPages=Math.ceil(partition(s2).shown.length/pageSize);});UI.pagerRow(document.querySelector('.panel')).append(mainPager);
  const popupPager=UI.pagerActions(state,s=>{if(!scenarioReady(s))return lastPopupPages;return lastPopupPages=Math.ceil(donorDetail(s.selected,s).length/pageSize);},{key:'popupPage',label:'donor page'});document.getElementById('popupControls').append(popupPager);
  /* Segment colours are assigned across the whole key set at once, so the five
     named donors and "Other cutting donors" are guaranteed distinguishable. A
     per-key hash could not promise that: it previously gave the United Kingdom
     and Other the same grey, and Germany and Canada the same teal. */
  let palette=new Map();
  const colour=code=>palette.get(String(code))||window.CGDSet.RESIDUAL;
  /* The popup ranks every donor, not just the top five, so it uses each donor's
     pinned colour rather than this chart's six-key assignment. */
  const donorColour=code=>window.CGDSet.colourFor(code);
  /* Precision follows magnitude across a four-decade axis: two decimals matter
     at 0.03% of GNI and are noise at 40%. */
  const pctOfGni=v=>M.percent(v,{decimals:Math.abs(v)>=.1?0:Math.abs(v)>=.01?1:2});
  async function ensure(s){await payload.blobs(M.seriesBlobNames('donor_recipient',{scenario:s.scenario,measure:'gross'}));}
  function donorLosses(s){return payload.axes.donor.map(code=>{let loss=0;for(const iso of payload.axes.recipient){const b=M.valueAt(payload,'donor_recipient',{...s,measure:'gross',year:2024},{donor:code,recipient:iso});const n=M.valueAt(payload,'donor_recipient',{...s,measure:'gross',year:2028},{donor:code,recipient:iso});loss+=Math.max(0,b-n);}return{code,loss};}).sort((a,b)=>b.loss-a.loss);}
  function topDonors(s){return donorLosses(s).slice(0,5).map(d=>d.code);}
  function rowsFor(s){const top=topDonors(s),rows=[];for(const iso of payload.axes.recipient){const d=M.denominator(payload,iso,'gni');if(!d.available)continue;const segments=Object.fromEntries([...top,OTHER].map(k=>[k,0]));for(const donor of payload.axes.donor){const b=M.valueAt(payload,'donor_recipient',{...s,measure:'gross',year:2024},{donor,recipient:iso});const n=M.valueAt(payload,'donor_recipient',{...s,measure:'gross',year:2028},{donor,recipient:iso});const cut=Math.max(0,b-n);segments[top.includes(donor)?donor:OTHER]+=cut/(d.value/1e6);}const total=Object.values(segments).reduce((a,b)=>a+b,0);if(total>0)rows.push({iso,name:payload.recipientName(iso),segments,total});}return rows.sort((a,b)=>b.total-a.total);}
  /* The advanced control removes the handful of very small, very aid-dependent
     economies whose cut exceeds half their GNI. They are excluded from the
     axis domain as well as the rows, so the scale is recomputed for the set
     actually shown rather than being held open by a row that is not there. */
  function partition(s){const all=rowsFor(s),excluded=s.excludeOutliers?all.filter(r=>r.total>OUTLIER_THRESHOLD):[],shown=s.excludeOutliers?all.filter(r=>r.total<=OUTLIER_THRESHOLD):all;return{all,shown,excluded};}
  function donorDetail(iso,s){if(!iso)return[];const d=M.denominator(payload,iso,'gni');if(!d.available)return[];return payload.axes.donor.map(code=>{const base=M.valueAt(payload,'donor_recipient',{...s,measure:'gross',year:2024},{donor:code,recipient:iso})/(d.value/1e6),now=M.valueAt(payload,'donor_recipient',{...s,measure:'gross',year:2028},{donor:code,recipient:iso})/(d.value/1e6);return{code,name:payload.donorName(code),base,now,change:now-base};}).filter(r=>r.base>0||r.now>0).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change));}
  const tooltip=document.getElementById('tooltip'),popup=document.getElementById('detailPopup');let closePopup=null;
  function showTip(row,code,target){const label=code===OTHER?OTHER:payload.donorName(code),value=row.segments[code];tooltip.replaceChildren(element('strong',{text:row.name}),element('div',{text:label}),element('div',{text:`Cut: ${pctOfGni(value)} of GNI`}));tooltip.hidden=false;const b=target.getBoundingClientRect(),rb=root.getBoundingClientRect();tooltip.style.left=`${Math.min(rb.width-tooltip.offsetWidth-8,Math.max(8,b.left-rb.left+8))}px`;tooltip.style.top=`${b.bottom-rb.top+3}px`;}
  function openDetail(iso,trigger){state.set({selected:iso,popupPage:0});const row=rowsFor(state.get()).find(r=>r.iso===iso);document.getElementById('popupTitle').textContent=row?.name||payload.recipientName(iso);popup.hidden=false;renderPopup();
    /* The panel declares aria-modal, so focus has to actually go into it and stay
       there until it closes; the trigger gets focus back on close. */
    const release=UI.trapFocus(popup);
    closePopup=UI.attachDismiss(popup,()=>{release();popup.hidden=true;state.set({selected:null,popupPage:0});},{returnFocusTo:trigger});}
  document.getElementById('popupClose').addEventListener('click',()=>closePopup?.());
  const advancedBtn=document.getElementById('advancedBtn'),advancedPanel=document.getElementById('advancedPanel'),outlierBox=document.getElementById('excludeOutliers');
  advancedBtn.addEventListener('click',()=>{const open=advancedPanel.hidden;advancedPanel.hidden=!open;advancedBtn.setAttribute('aria-expanded',String(open));});
  outlierBox.addEventListener('change',()=>state.set({excludeOutliers:outlierBox.checked}));
  state.subscribe(s=>{outlierBox.checked=s.excludeOutliers;});
  function renderPopup(){const s=state.get(),all=donorDetail(s.selected,s),page=Math.min(s.popupPage,Math.max(0,Math.ceil(all.length/pageSize)-1)),shown=all.slice(page*pageSize,(page+1)*pageSize),max=Math.max(.000001,...shown.flatMap(r=>[r.base,r.now]));document.getElementById('dotRows').replaceChildren();for(const r of shown){const row=element('div',{className:'dot-row'}),svg=svgEl('svg',{'aria-label':`${r.name}: ${pctOfGni(r.base)} in 2024, ${pctOfGni(r.now)} in 2028`}),x=v=>`${4+92*v/max}%`;const dotBase=svgEl('circle',{cx:x(r.base),cy:15,r:3,fill:'var(--cgd-gold)'}),dotNow=svgEl('circle',{cx:x(r.now),cy:15,r:3.5,fill:'var(--cgd-teal)'});
    svg.append(svgEl('line',{x1:x(r.base),x2:x(r.now),y1:15,y2:15,stroke:'#85A5AD','stroke-width':1.2}),dotBase,dotNow);
    /* One colour pair for every row, as in F11: colouring the 2028 dot by DONOR
       made each row a different colour, so the pair read as a category key
       rather than as before-and-after. */
    const move=r.now-r.base,
      shift=Math.abs(move)<1e-9?'no change':`${move>0?'up':'down'} ${pctOfGni(Math.abs(move))} of GNI`;
    UI.hoverTip(dotBase,`${r.name} \u2014 2024: ${pctOfGni(r.base)} of GNI.`);
    UI.hoverTip(dotNow,`${r.name} \u2014 2028: ${pctOfGni(r.now)} of GNI (${shift} on 2024).`);
    const nameCell=element('span',{text:r.name});
    UI.hoverTip(nameCell,`${r.name}: ${pctOfGni(r.base)} of GNI in 2024, ${pctOfGni(r.now)} in 2028 (${shift}).`);
    row.append(nameCell,svg,element('span',{className:'dot-value',text:pctOfGni(r.now)}));document.getElementById('dotRows').append(row);}popupPager.sync();}
  function render(){const s=state.get(),parts=partition(s),all=parts.shown,top=topDonors(s),page=Math.min(s.page,Math.max(0,Math.ceil(all.length/pageSize)-1)),shown=all.slice(page*pageSize,(page+1)*pageSize),keys=[...top,OTHER];palette=window.CGDSet.assignColours(keys,{residual:[OTHER]});
    /* Logarithmic. Attributed cuts span more than three orders of magnitude —
       Marshall Islands at over 100% of GNI against recipients at hundredths of
       a per cent — and on a linear axis every row below the top three was an
       invisible sliver. A stacked bar on a log axis is read by segment
       BOUNDARIES, not by segment width, so the tooltip and the total column
       carry the values and the notes say so. */
    const maxTotal=Math.max(...all.map(r=>r.total),1e-9),floor=1e-4,hi=maxTotal*1.12,lo=Math.min(floor,hi/1.0001),logX=v=>{const c=Math.max(lo,Math.min(hi,v));return (Math.log10(c)-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo)||1)*100;};document.getElementById('rows').replaceChildren();for(const row of shown){const wrap=element('div',{className:'loss-row'}),name=element('button',{className:'loss-name',text:row.name,attributes:{type:'button',title:row.name}});name.addEventListener('click',()=>openDetail(row.iso,name));const bar=element('div',{className:'loss-bar'}),svg=svgEl('svg',{'aria-label':`${row.name}: cuts worth ${pctOfGni(row.total)} of GNI`});let acc=0,x=0;for(const code of keys){const value=row.segments[code];if(!(value>0))continue;const from=acc>0?logX(acc):0;acc+=value;const to=logX(acc),w=Math.max(to-from,0);x=from;const rect=svgEl('rect',{x:`${x}%`,width:`${w}%`,y:4,height:19,fill:colour(code),tabindex:'0',role:'img','aria-label':`${row.name}, ${code===OTHER?OTHER:payload.donorName(code)}: ${pctOfGni(value)} of GNI`});rect.addEventListener('pointerenter',()=>showTip(row,code,rect));rect.addEventListener('pointerleave',()=>tooltip.hidden=true);rect.addEventListener('focus',()=>showTip(row,code,rect));rect.addEventListener('blur',()=>tooltip.hidden=true);rect.addEventListener('click',e=>{e.stopPropagation();openDetail(row.iso,rect);});svg.append(rect);}bar.append(svg);wrap.append(name,bar,element('div',{className:'loss-total',text:pctOfGni(row.total)}));document.getElementById('rows').append(wrap);}
    const axis=document.getElementById('axisSvg');axis.replaceChildren();const decades=[];for(let e=Math.floor(Math.log10(lo));e<=Math.ceil(Math.log10(hi));e+=1){const v=10**e;if(v>=lo&&v<=hi)decades.push(v);}if(!decades.length)decades.push(lo,hi);const ticks=C.thinTicks(decades,innerWidth<=520?3:5);ticks.forEach((v,i)=>{const pos=logX(v),first=i===0,last=i===ticks.length-1;const tx=svgEl('text',{x:`${pos}%`,y:16,dx:first?2:last?-2:0,'text-anchor':first?'start':last?'end':'middle',class:'axis'});tx.textContent=M.percent(v,{decimals:v<.01?2:v<.1?1:0});axis.append(tx);});const legend=document.getElementById('legend');legend.replaceChildren();for(const code of keys){const sw=element('span',{className:'legend-swatch'});sw.style.background=colour(code);legend.append(element('span',{className:'legend-key'},[sw,element('span',{text:code===OTHER?'Other cutting donors':payload.donorName(code)})]));}
    document.getElementById('vizSub').textContent=`Gross bilateral ODA cuts between 2024 and 2028 under ${M.scenarioInfo(s.scenario).name.toLowerCase()}.`;UI.renderNotes('notes',{visible:[`Recipients ${page*pageSize+1}–${page*pageSize+shown.length} of ${all.length} with positive attributed cuts and available GNI.`+(parts.excluded.length?` Excluded outliers: ${parts.excluded.map(r=>r.name).sort().join(', ')}.`:'')],notes:[
      'The axis is logarithmic and starts at 0.01% of GNI; smaller cuts are drawn at the axis floor.',
      'Cuts are donor-recipient reductions floored at zero, so increases from other donors do not offset them.',
      'Marshall Islands is an exceptional 2024 case: its baseline includes large US Compact payments, so its cut should not be read as a fall from a normal annual aid level.',
      M.denominatorNote(payload,'gni'),
      UI.STANDARD_NOTES.prices
    ].filter(Boolean).filter(Boolean)});renderNotes(parts);if(mainPager&&mainPager.sync)mainPager.sync();if(!popup.hidden)renderPopup();window.CGD_READY=true;
  }
  function renderNotes(parts){
    /* The exclusion is reported on the count line above, not as a paragraph of its
       own: the reader wants the names, and the fact that the axis is recomputed is
       in the notes. */
    
  }
  let seq=0;async function schedule(){const n=++seq;tooltip.hidden=true;try{await ensure(state.get());if(n!==seq)return;render();}catch(error){if(n===seq)P.renderFailState(chartArea,error); window.CGD_READY = true;}}
  await ensure(state.get());render();document.getElementById('fullscreenBtn').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():root.requestFullscreen?.());window.ODA_F6={state,rows:()=>rowsFor(state.get()),partition:()=>partition(state.get()),OUTLIER_THRESHOLD,detail:()=>donorDetail(state.get().selected,state.get())};
})();
</script><script src="shared/cgd-embed.js?v=20260902b"></script></body></html>
