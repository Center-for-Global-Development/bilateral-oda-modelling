<body><main id="vizRoot" class="viz-wrapper"><div class="header-row"><div class="title-block"><h1 id="vizTitle">How aid losses are distributed across countries</h1><p class="viz-sub" id="vizSub"></p></div>

<script>
(async()=>{'use strict';
  window.CGD_READY = false;const{element}=window.CGDDom,C=window.CGDCore,P=window.ODAPayload,M=window.ODAModel,UI=window.ODAUI;const root=document.getElementById('vizRoot'),chartArea=document.getElementById('chartArea');let payload,world;

  const years=M.displayYears(payload),state=UI.createState({scenario:'S1',measure:'gross',year:2028,sector:'ALL',metric:'pct',searchType:'recipient',selected:'ALL',unit:'pct'},{dependents:{searchType:['selected']},onChange:scheduleRender});

  const typeBox=element('div',{className:'segmented',attributes:{role:'group','aria-label':'Search for donor or recipient'}});for(const[v,l]of[['donor','Donor'],['recipient','Recipient']]){const b=element('button',{text:l,attributes:{type:'button','data-type':v}});b.addEventListener('click',()=>state.set({searchType:v,selected:'ALL'}));typeBox.append(b);}

  const donorM49={ARE:'784',AUS:'036',AUT:'040',AZE:'031',BEL:'056',BGR:'100',CAN:'124',CHE:'756',CYP:'196',CZE:'203',DEU:'276',DNK:'208',ESP:'724',EST:'233',FIN:'246',FRA:'250',GBR:'826',GRC:'300',HRV:'191',HUN:'348',IRL:'372',ISL:'352',ISR:'376',ITA:'380',JPN:'392',KAZ:'398',KOR:'410',KWT:'414',LIE:'438',LTU:'440',LUX:'442',LVA:'428',MCO:'492',MLT:'470',NLD:'528',NOR:'578',NZL:'554',POL:'616',PRT:'620',QAT:'634',ROU:'642',SAU:'682',SVK:'703',SVN:'705',SWE:'752',THA:'764',TUR:'792',TWN:'158',USA:'840'};
  const recByM49=new Map(Object.entries(payload.geometryKey.mapping||{}).map(([iso,id])=>[String(id).padStart(3,'0'),iso])),donorByM49=new Map(Object.entries(donorM49).map(([d,id])=>[id,d]));

  async function aggregate(s){const donor=s.searchType==='donor'&&s.selected!=='ALL'?s.selected:null,base=new Map(),now=new Map();
    if(donor&&s.sector!=='ALL'){for(const r of await M.cubeCells(payload,{scenario:s.scenario,measure:s.measure,year:2024,donor,sector:s.sector}))base.set(r.recipient,(base.get(r.recipient)||0)+r.value);for(const r of await M.cubeCells(payload,{scenario:s.scenario,measure:s.measure,year:s.year,donor,sector:s.sector}))now.set(r.recipient,(now.get(r.recipient)||0)+r.value);}
    else{const grain=donor?'donor_recipient':'recipient_sector';await payload.blobs(M.seriesBlobNames(grain,s));for(const iso of payload.axes.recipient){let b=0,n=0;if(donor){b=M.valueAt(payload,grain,{...s,year:2024},{donor,recipient:iso});n=M.valueAt(payload,grain,s,{donor,recipient:iso});}else{const sectors=s.sector==='ALL'?payload.axes.sector:[s.sector];for(const sec of sectors){b+=M.valueAt(payload,grain,{...s,year:2024},{recipient:iso,sector:sec});n+=M.valueAt(payload,grain,s,{recipient:iso,sector:sec});}}base.set(iso,b);now.set(iso,n);}}

  async function flows(s){if(s.selected==='ALL')return[];const out=[];if(s.sector!=='ALL'){const filter=s.searchType==='donor'?{donor:s.selected,sector:s.sector}:{recipient:s.selected,sector:s.sector};for(const r of await M.cubeCells(payload,{scenario:s.scenario,measure:s.measure,year:s.year,...filter}))out.push(r);}else{await payload.blobs(M.seriesBlobNames('donor_recipient',s));if(s.searchType==='donor'){for(const recipient of payload.axes.recipient){const value=M.valueAt(payload,'donor_recipient',s,{donor:s.selected,recipient});if(value>0)out.push({donor:s.selected,recipient,value});}}else{for(const donor of payload.axes.donor){const value=M.valueAt(payload,'donor_recipient',s,{donor,recipient:s.selected});if(value>0)out.push({donor,recipient:s.selected,value});}}}return out.sort((a,b)=>b.value-a.value);}

  const svg=d3.select('#mapSvg'),tooltip=document.getElementById('tooltip');let projection,path,zoom,rootG,lastWidth=700,currentData,currentFlows=[],version=0,pinned=null;
  let shadeCap=NaN;
  function fmtShade(v,s){if(!Number.isFinite(v))return'Not available';if(s.metric==='pct')return`${v>=0?'−':'+'}${M.percent(Math.abs(v),{decimals:1})}`;if(s.metric==='total')return`${v>=0?'−':'+'}${M.usd(Math.abs(v))}`;return`${v>=0?'−':'+'}US$${Math.abs(v).toLocaleString('en-GB',{maximumFractionDigits:0})} per person`;}
  /* The house diverging ramp is linear in value, and with the scale capped at the
   95th percentile most recipients sit in its lower half, so the map came out
   almost uniformly pale. The endpoints are unchanged — they are brand tokens —
   but the ramp is now gamma-corrected, which gives mid-range losses real colour
   while keeping the ordering exact. */
  const SHADE_GAMMA=0.5;
  function colour(v,cap){if(!Number.isFinite(v))return'#DFE0E2';if(Math.abs(v)<cap*.015)return'#F3F6F7';const t=Math.pow(Math.min(1,Math.abs(v)/cap),SHADE_GAMMA);return v>0?d3.interpolateRgb('#F3F6F7','#D15553')(t):d3.interpolateRgb('#F3F6F7','#006970')(t);}
  function showTooltip(lines,event,target){tooltip.replaceChildren(...lines.map((x,i)=>i===0?element('strong',{text:x}):element('div',{text:x})));tooltip.hidden=false;let x,y;if(event?.clientX){const rb=root.getBoundingClientRect();x=event.clientX-rb.left+10;y=event.clientY-rb.top+10;}else{const b=target.getBoundingClientRect(),rb=root.getBoundingClientRect();x=b.left-rb.left+10;y=b.bottom-rb.top+4;}tooltip.style.left=`${Math.min(root.clientWidth-tooltip.offsetWidth-8,Math.max(8,x))}px`;tooltip.style.top=`${Math.max(8,y)}px`;}
  function geoLine(a,b){const interp=d3.geoInterpolate(a,b),coords=d3.range(0,1.001,1/24).map(interp);return path({type:'LineString',coordinates:coords});}
  function renderMap(width,s,data,flowRows){const height=Math.max(330,Math.min(500,width*.56)),donorSet=new Set(payload.axes.donor),available=Array.from(data.values()).map(d=>d.value).filter(Number.isFinite),abs=available.map(Math.abs).sort(d3.ascending),cap=d3.quantile(abs,.95)||1;svg.attr('viewBox',`0 0 ${width} ${height}`).attr('height',height);projection=d3.geoNaturalEarth1().fitExtent([[5,8],[width-5,height-8]],{type:'FeatureCollection',features});path=d3.geoPath(projection);svg.selectAll('*').remove();rootG=svg.append('g');
    rootG.selectAll('path.country').data(features).join('path').attr('class',f=>`country${(s.searchType==='recipient'&&s.selected===f.recipient)||(s.searchType==='donor'&&s.selected===f.donor)?' selected':''}`).attr('d',path).attr('fill',f=>f.donor?'#85A5AD':f.recipient?colour(data.get(f.recipient)?.value,cap):'#E8EFF1').attr('tabindex',f=>f.recipient||f.donor?'0':null).attr('role',f=>f.recipient||f.donor?'img':null).attr('aria-label',f=>{const labels=[];if(f.recipient)labels.push(`${payload.recipientName(f.recipient)} recipient, ${fmtShade(data.get(f.recipient)?.value,s)}`);if(f.donor)labels.push(`${payload.donorName(f.donor)} donor`);return labels.join('; ');}).on('pointerenter focus',function(event,f){const lines=[];if(f.recipient){const d=data.get(f.recipient);lines.push(payload.recipientName(f.recipient),`${s.year} versus 2024: ${fmtShade(d?.value,s)}`,`2024 ODA: ${M.usd(d?.base)}`,`${s.year} ODA: ${M.usd(d?.now)}`,`Income group: ${M.incomeGroup(payload,f.recipient)}`);}else if(f.donor)lines.push(payload.donorName(f.donor),'Donor country');showTooltip(lines,event,this);}).on('pointerleave blur',()=>{if(!pinned)tooltip.hidden=true;}).on('click',function(event,f){if(!f.recipient)return;event.stopPropagation();state.set({searchType:'recipient',selected:f.recipient});pinned=this;});
    const mapped=flowRows.filter(r=>featureByDonor.has(r.donor)&&featureByRecipient.has(r.recipient)),shown=mapped.slice(0,40),maxFlow=d3.max(shown,d=>d.value)||1,flowG=rootG.append('g');for(const r of shown.slice().reverse()){const a=d3.geoCentroid(featureByDonor.get(r.donor)),b=d3.geoCentroid(featureByRecipient.get(r.recipient)),d=geoLine(a,b),w=.6+4*Math.sqrt(r.value/maxFlow);flowG.append('path').attr('class','flow').attr('d',d).attr('stroke-width',w);flowG.append('path').attr('class','flow-hit').attr('d',d).attr('tabindex',0).attr('role','img').attr('aria-label',`${payload.donorName(r.donor)} to ${payload.recipientName(r.recipient)}, ${M.usd(r.value)}`).on('pointerenter focus',function(event){showTooltip([`${payload.donorName(r.donor)} → ${payload.recipientName(r.recipient)}`,`${s.year} ODA: ${M.usd(r.value)}`,s.sector==='ALL'?'All sectors':payload.sectorName(s.sector)],event,this);}).on('pointerleave blur',()=>{if(!pinned)tooltip.hidden=true;}).on('click',function(event){event.stopPropagation();pinned=this;showTooltip([`${payload.donorName(r.donor)} → ${payload.recipientName(r.recipient)}`,`${s.year} ODA: ${M.usd(r.value)}`],event,this);UI.attachDismiss(tooltip,()=>{pinned=null;tooltip.hidden=true;},{returnFocusTo:this});});}
    for(const [donor,f]of featureByDonor){const c=projection(d3.geoCentroid(f));if(c)rootG.append('circle').attr('class','donor-marker').attr('cx',c[0]).attr('cy',c[1]).attr('r',2.2);}
    zoom=d3.zoom().scaleExtent([1,8]).on('zoom',event=>rootG.attr('transform',event.transform));svg.call(zoom);document.getElementById('zoomIn').onclick=()=>svg.transition().call(zoom.scaleBy,1.5);document.getElementById('zoomOut').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.5);document.getElementById('zoomReset').onclick=()=>svg.transition().call(zoom.transform,d3.zoomIdentity);
    shadeCap=cap;const legend=document.getElementById('legend');legend.replaceChildren();for(const[label,bg,tip]of[['Gain','#006970',`Full colour at ${fmtShade(-cap,s)} or better`],['Little change','#F3F6F7',''],['Loss','#D15553',`Full colour at ${fmtShade(cap,s)} or worse`],['Donor country','#85A5AD',''],['No data / not a recipient','#DFE0E2','']]){const sw=element('span',{className:'map-swatch'});sw.style.background=bg;legend.append(element('span',{className:'map-key',attributes:tip?{title:tip}:{}},[sw,element('span',{text:label})]));}
    updateNotes(s,data,flowRows,mapped,shown);window.CGD_READY=true;
  }
  function updateNotes(s,data,flowRows,mapped,shown){const unavailable=Array.from(data).filter(([,d])=>!Number.isFinite(d.value)).map(([iso])=>payload.recipientName(iso));const mappedValue=mapped.reduce((a,b)=>a+b.value,0),shownValue=shown.reduce((a,b)=>a+b.value,0),visible=[];if(s.metric==='pc'&&unavailable.length)visible.push(`${unavailable.length} recipients lack population data and cannot be shaded per person: ${unavailable.sort().join(', ')}.`);if(flowRows.length&&shown.length<flowRows.length)visible.push(`${shown.length} largest mapped flows shown; they represent ${M.percent(mappedValue?shownValue/mappedValue:0,{decimals:1})} of mapped selected-flow value.`);document.getElementById('vizSub').textContent=`${s.year} ${s.metric==='pct'?'percentage':s.metric==='total'?'total':'per-person'} loss versus 2024 under ${M.scenarioInfo(s.scenario).name.toLowerCase()}.`;document.getElementById('chartSummary').textContent=`${Array.from(data.values()).filter(d=>Number.isFinite(d.value)).length} of ${payload.axes.recipient.length} recipients have a drawable value.`;document.getElementById('notes').replaceChildren(UI.notes({visible,notes:[`Recipient shading is capped at the 95th percentile of absolute change so the predominantly one-sided loss distribution remains legible: full colour is reached at ${fmtShade(shadeCap,s)}. Donor countries use a uniform grey fill.`,`Kosovo is retained in totals but cannot be shaded because the selected world geometry has no stable feature; its 2024 grant-equivalent ODA is ${M.usd(payload.geometryKey.approved_unmapped?.XKV?.oda_2024_ge_usd_mn)}.`,UI.STANDARD_NOTES.prices,UI.STANDARD_NOTES.unallocable,UI.STANDARD_NOTES.baselineYear],source:`Source: CGD modelling, ${payload.release}. Map geometry: world-atlas 2.0.2.`}));}
  let frame=null;async function run(v){const s=state.get();try{const[data,flowRows]=await Promise.all([aggregate(s),flows(s)]);if(v!==version)return;currentData=data;currentFlows=flowRows;renderMap(lastWidth,s,data,flowRows);}catch(error){if(v===version)P.renderFailState(chartArea,error); window.CGD_READY = true;}}function scheduleRender(){if(frame)cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{frame=null;pinned=null;tooltip.hidden=true;run(++version);});}
  C.observeInlineSize(document.getElementById('mapShell'),w=>{lastWidth=w;if(currentData)renderMap(w,state.get(),currentData,currentFlows);});document.getElementById('fullscreenBtn').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():root.requestFullscreen?.());run(++version);window.ODA_F3={state,aggregate:()=>aggregate(state.get()),flows:()=>flows(state.get())};
})();</script><script src="shared/cgd-embed.js"></script></body></html>
