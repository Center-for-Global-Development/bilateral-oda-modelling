<!doctype html>
<html lang="en" data-cgd-interactive-name="oda-f4-recipient-sector-losses">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Government and civil society loses over half its bilateral aid by 2028, and reproductive health over a third</title>
<link rel="stylesheet" href="shared/cgd-figure.css?v=20261009d"><link rel="stylesheet" href="shared/cgd-responsive.css?v=20261009d"><link rel="stylesheet" href="shared/oda-figure.css?v=20261009d">
<style>
  /* Ranked bars: sector name | bar | value. One grid shared by the heading, the
     rows and the axis so the columns always line up. */
  .bar-head,.sector-row,.bar-axis{display:grid;grid-template-columns:minmax(120px,210px) minmax(140px,1fr) 64px;gap:8px;align-items:center}
  .bar-head{font-size:11px;font-weight:600;color:var(--cgd-dark-gray);padding:4px 5px;border-bottom:1px solid var(--cgd-border)}
  .bar-head span:last-child{text-align:right}
  .sector-row{min-height:26px;padding:1px 5px;border-bottom:1px solid var(--cgd-light-gray)}
  .sector-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sector-row.small .sector-name,.sector-row.small .sector-value{color:var(--cgd-dark-gray);font-weight:500}
  .sector-bar svg{display:block;width:100%;height:20px;overflow:visible}
  .sector-value{text-align:right;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .bar-axis{padding:0 5px}.bar-axis svg{display:block;width:100%;height:24px;overflow:visible}
  .zero-line{stroke:var(--cgd-teal-black);stroke-width:1}
  .tooltip{position:absolute;z-index:20;max-width:280px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px}.legend-item{display:inline-flex;align-items:center;gap:5px}
  .legend .swatch{width:12px;height:8px;border-radius:2px;display:inline-block}
  /* Phones: the sector name takes its own line above the bar, so names are never cut off. */
  @media(max-width:520px){.bar-head,.sector-row,.bar-axis{grid-template-columns:minmax(90px,1fr) 46px;gap:2px 6px}.bar-head span:first-child{display:none}.sector-name{grid-column:1 / -1;white-space:normal;font-size:11.5px;padding-top:3px}.sector-value{font-size:11px}.bar-axis span:first-child{display:none}}
</style></head>
<body><main id="vizRoot" class="viz-wrapper" data-oda-top="Allocation rule"><div class="header-row"><div class="title-block"><h1 id="vizTitle">Government and civil society loses over half its bilateral aid by 2028, and reproductive health over a third</h1><p class="viz-sub" id="vizSub"></p></div>
<button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="View fullscreen"><svg class="icon-expand" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5" stroke="currentColor" stroke-width="1.8"/></svg><svg class="icon-compress" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
<section class="panel"><div class="panel-header"><div class="legend" id="legend"></div></div><div class="chart-area" id="chartArea"><div class="bar-head"><span>Sector</span><span id="barHeading"></span><span id="valueHeading"></span></div><div id="rows" role="list"></div><div class="bar-axis"><span></span><svg id="axisSvg" aria-hidden="true"></svg><span></span></div></div></section>
<div class="controls" id="controls"></div><div id="notes"></div><div class="tooltip" id="tooltip" hidden></div></main>
<script src="shared/dom.js?v=20261009d"></script><script src="shared/chart-core.js?v=20261009d"></script><script src="shared/set-config.js?v=20261009d"></script><script src="shared/oda-payload.js?v=20261009d"></script><script src="shared/oda-model.js?v=20261009d"></script><script src="shared/oda-ui.js?v=20261009d"></script>
<script>
/* F4 — bilateral ODA cuts by sector.

   A ranked bar per sector: the share of its 2024 bilateral ODA lost by the
   selected year (or the US$ lost), for all recipients or one. It replaced a
   recipient-by-recipient scatter for one sector at a time, which buried the
   sector comparison the title makes (review of 9 October 2026).

   Gross only. The model converts each recipient-sector cell between gross and
   grant-equivalent at a fixed ratio, so the % cut is the same on either measure
   for nearly every cell; a measure toggle changed almost nothing. */
(async () => {
  'use strict';
  window.CGD_READY = false;
  const { element, svgEl } = window.CGDDom, P = window.ODAPayload, M = window.ODAModel, UI = window.ODAUI;
  const root = document.getElementById('vizRoot'), chartArea = document.getElementById('chartArea');
  let payload;
  try { payload = await P.load(); } catch (error) { P.renderFailState(chartArea, error); window.CGD_READY = true; return; }

  const LOSS = '#D15553', GAIN = '#006970', SMALL = '#B8C4C8';
  /* Below this 2024 baseline a sector's % change is driven by a handful of
     projects, so it is drawn in grey, kept out of the axis domain and counted
     in the notes. The bar is lower for one recipient than for all of them. */
  const smallBase = s => s.recipient === 'ALL' ? 100 : 5; // US$ million
  const years = M.displayYears(payload);
  const state = UI.createState({ scenario: 'S1', measure: 'gross', year: 2028, recipient: 'ALL', unit: 'pct' }, { onChange: scheduleRender });

  function setVizSub(s) {
    const who = s.recipient === 'ALL' ? 'all recipients' : payload.recipientName(s.recipient);
    const what = s.unit === 'pct' ? 'Share of 2024 gross bilateral ODA lost' : 'Gross bilateral ODA lost since 2024 (US$)';
    document.getElementById('vizSub').textContent =
      `${what} by ${s.year}, by sector, ${who}, under ${M.scenarioInfo(s.scenario).name.toLowerCase()}`;
  }
  state.subscribe(setVizSub); setVizSub(state.get());

  const recipientSelect = element('select', { className: 'plain-select oda-select-wide' });
  recipientSelect.append(element('option', { text: 'All recipients', attributes: { value: 'ALL' } }));
  payload.axes.recipient.slice().sort((a, b) => payload.recipientName(a).localeCompare(payload.recipientName(b)))
    .forEach(iso => recipientSelect.append(element('option', { text: payload.recipientName(iso), attributes: { value: iso } })));
  recipientSelect.value = state.get().recipient;
  recipientSelect.addEventListener('change', () => state.set({ recipient: recipientSelect.value }));
  state.subscribe(s => { recipientSelect.value = s.recipient; });

  const unitBox = element('div', { className: 'segmented', attributes: { role: 'group', 'aria-label': 'Show' } });
  for (const [v, l] of [['pct', '% cut'], ['usd', 'US$ lost']]) {
    const b = element('button', { text: l, attributes: { type: 'button', 'data-unit': v } });
    b.addEventListener('click', () => state.set({ unit: v }));
    unitBox.append(b);
  }
  const syncUnit = s => unitBox.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.unit === s.unit)));
  state.subscribe(syncUnit); syncUnit(state.get());

  document.getElementById('controls').append(
    UI.scenarioSelect(state), UI.yearControl(state, years),
    UI.controlGroup('Show', unitBox), UI.controlGroup('Recipient', recipientSelect, { id: 'recipientSelect' }));

  const grainOf = s => s.recipient === 'ALL' ? 'sector' : 'recipient_sector';
  async function ensure(s) { await payload.blobs(M.seriesBlobNames(grainOf(s), s)); }

  function rows(s) {
    const grain = grainOf(s), out = [];
    for (const sec of payload.axes.sector) {
      const coords = s.recipient === 'ALL' ? { sector: sec } : { recipient: s.recipient, sector: sec };
      const base = M.valueAt(payload, grain, { ...s, year: 2024 }, coords);
      const now = M.valueAt(payload, grain, s, coords);
      if (!(base > 0) || !Number.isFinite(now)) continue;
      const lost = base - now;
      out.push({ sec, name: payload.sectorName(sec), base, now, lost, share: lost / base, small: base < smallBase(s) });
    }
    const key = r => s.unit === 'pct' ? r.share : r.lost;
    return out.sort((a, b) => key(b) - key(a) || a.name.localeCompare(b.name));
  }

  const tooltip = document.getElementById('tooltip');
  function showTip(r, target) {
    const s = state.get();
    tooltip.replaceChildren(
      element('strong', { text: r.name }),
      element('div', { text: `2024: ${M.usd(r.base)}` }),
      element('div', { text: `${s.year}: ${M.usd(r.now)}` }),
      element('div', { text: r.lost >= 0 ? `Lost: ${M.usd(r.lost)} (${M.percent(r.share, { decimals: 1 })})`
                                         : `Gained: ${M.usd(-r.lost)} (+${M.percent(-r.share, { decimals: 1 })})` }));
    tooltip.hidden = false;
    const b = target.getBoundingClientRect(), rb = root.getBoundingClientRect();
    tooltip.style.left = `${Math.min(rb.width - tooltip.offsetWidth - 8, Math.max(8, b.left - rb.left + 8))}px`;
    tooltip.style.top = `${b.bottom - rb.top + 4}px`;
  }

  function fmtValue(r, s) {
    if (s.unit === 'pct') return r.share >= 0 ? M.percent(r.share, { decimals: 0 }) : `+${M.percent(-r.share, { decimals: 0 })}`;
    return r.lost >= 0 ? M.usd(r.lost, { compact: true }) : `+${M.usd(-r.lost, { compact: true })}`;
  }

  function render() {
    const s = state.get(), data = rows(s), host = document.getElementById('rows');
    host.replaceChildren(); tooltip.hidden = true;
    document.getElementById('barHeading').textContent = s.unit === 'pct' ? `Share of 2024 ODA lost by ${s.year}` : `US$ lost by ${s.year}`;
    document.getElementById('valueHeading').textContent = s.unit === 'pct' ? '% cut' : 'US$ lost';
    const val = r => s.unit === 'pct' ? r.share : r.lost;
    /* Domain always includes zero; increases run left of it. Small sectors are
       left out of the domain and their bars clipped at its edge, so one tiny
       sector cannot squash the rest. */
    const scaled = data.filter(r => !r.small).map(val);
    const lo = Math.min(0, ...scaled), hi = Math.max(0, ...scaled, 1e-9);
    const span = hi - lo || 1, pos = v => Math.max(0, Math.min(100, (v - lo) / span * 100));
    for (const r of data) {
      const v = val(r), x0 = pos(Math.min(0, v)), x1 = pos(Math.max(0, v));
      const fill = r.small ? SMALL : v >= 0 ? LOSS : GAIN;
      const row = element('div', { className: `sector-row${r.small ? ' small' : ''}`, attributes: { role: 'listitem' } });
      const svg = svgEl('svg', { 'aria-hidden': 'true' });
      svg.append(svgEl('line', { x1: `${pos(0)}%`, x2: `${pos(0)}%`, y1: 0, y2: 20, class: 'zero-line' }));
      svg.append(svgEl('rect', { x: `${x0}%`, width: `${Math.max(x1 - x0, 0.3)}%`, y: 4, height: 12, rx: 2, fill }));
      const name = element('div', { className: 'sector-name', text: M.sectorShortName(payload, r.sec) });
      const value = element('div', { className: 'sector-value', text: fmtValue(r, s) });
      row.append(name, element('div', { className: 'sector-bar' }, [svg]), value);
      row.tabIndex = 0;
      row.setAttribute('aria-label', `${r.name}: ${M.usd(r.base)} in 2024, ${M.usd(r.now)} in ${s.year}, ${fmtValue(r, s)}`);
      row.addEventListener('pointerenter', () => showTip(r, row));
      row.addEventListener('pointerleave', () => { tooltip.hidden = true; });
      row.addEventListener('focus', () => showTip(r, row));
      row.addEventListener('blur', () => { tooltip.hidden = true; });
      host.append(row);
    }
    drawAxis(lo, hi, s);
    drawLegend(data, s);
    const small = data.filter(r => r.small).length, missing = payload.axes.sector.length - data.length;
    const visible = [];
    if (small) visible.push(`${small} sector${small > 1 ? 's' : ''} with under US$${smallBase(s)}m in 2024 ${small > 1 ? 'are' : 'is'} shown in grey; ${small > 1 ? 'their' : 'its'} % change rests on few projects.`);
    if (missing) visible.push(`${missing} sector${missing > 1 ? 's' : ''} with no 2024 bilateral ODA ${s.recipient === 'ALL' ? '' : 'to this recipient '}${missing > 1 ? 'are' : 'is'} not shown.`);
    UI.renderNotes('notes', { visible, notes: [
      s.recipient === 'ALL' ? 'All-recipient totals include bilateral ODA allocated to a sector but not to a single recipient country.' : 'Sector totals for one recipient include only ODA allocated to that country.',
      'Gross ODA. The model converts between gross and grant-equivalent at a fixed ratio per recipient and sector, so % cuts are almost identical on either measure.',
      UI.STANDARD_NOTES.prices] });
    window.CGD_READY = true;
  }

  function drawAxis(lo, hi, s) {
    const axis = document.getElementById('axisSvg'); axis.replaceChildren();
    const step = niceStep((hi - lo) / 4), ticks = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(Math.abs(v) < 1e-9 ? 0 : v);
    const span = hi - lo || 1;
    ticks.forEach((v, i) => {
      const x = (v - lo) / span * 100, first = i === 0, last = i === ticks.length - 1;
      const t = svgEl('text', { x: `${x}%`, y: 14, 'text-anchor': first && x < 5 ? 'start' : last && x > 95 ? 'end' : 'middle', class: 'axis' });
      t.textContent = s.unit === 'pct' ? `${Math.round(v * 100)}%` : M.usd(v, { compact: true });
      axis.append(t);
    });
  }
  function niceStep(raw) {
    const p = 10 ** Math.floor(Math.log10(raw || 1)), n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
  }
  function drawLegend(data, s) {
    const legend = document.getElementById('legend'); legend.replaceChildren();
    const keys = [['Cut', LOSS, data.some(r => !r.small && r.lost >= 0)], ['Increase', GAIN, data.some(r => !r.small && r.lost < 0)], [`Under US$${smallBase(s)}m in 2024`, SMALL, data.some(r => r.small)]];
    for (const [label, colour, present] of keys) {
      if (!present) continue;
      const sw = element('span', { className: 'swatch' }); sw.style.background = colour;
      legend.append(element('span', { className: 'legend-item' }, [sw, element('span', { text: label })]));
    }
  }

  let frame = null, version = 0;
  function scheduleRender() {
    if (frame) cancelAnimationFrame(frame);
    frame = requestAnimationFrame(async () => {
      frame = null; const v = ++version;
      try { await ensure(state.get()); if (v === version) render(); }
      catch (error) { if (v === version) P.renderFailState(chartArea, error); window.CGD_READY = true; }
    });
  }
  try { await ensure(state.get()); } catch (error) { P.renderFailState(chartArea, error); window.CGD_READY = true; return; }
  render();
  document.getElementById('fullscreenBtn').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen?.());
  window.ODA_F4 = { state, rows: () => rows(state.get()) };
})();
</script><script src="shared/cgd-embed.js?v=20261009d"></script></body></html>
