<!doctype html>
<html lang="en" data-cgd-interactive-name="oda-f4-recipient-sector-losses">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Most sectors are heavily affected, but governance and reproductive health may see the deepest cuts</title>
<link rel="stylesheet" href="shared/cgd-figure.css?v=20260902b"><link rel="stylesheet" href="shared/cgd-responsive.css?v=20260902b"><link rel="stylesheet" href="shared/oda-figure.css?v=20260902b">

  .scatter-wrap{position:relative;width:100%;min-height:330px}.scatter-wrap svg{display:block;width:100%}.tooltip{position:absolute;z-index:20;max-width:280px}.legend{flex-wrap:wrap}.legend-item{font-size:11.5px}.selection-note{font-size:11.5px;color:var(--cgd-dark-gray)}

<body><main id="vizRoot" class="viz-wrapper"><div class="header-row"><div class="title-block"><h1 id="vizTitle">Most sectors are heavily affected, but governance and reproductive health may see the deepest cuts</h1></div>
<button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="View fullscreen" title="View fullscreen"><svg class="icon-expand" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5" stroke="currentColor" stroke-width="1.8"/></svg><svg class="icon-compress" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
<div class="controls" id="controls"></div><section class="panel"><div class="panel-header"><div class="legend" id="legend"></div></div><div class="chart-area" id="chartArea"><div class="scatter-wrap" id="scatterWrap"><svg id="scatterSvg" role="img" aria-labelledby="vizTitle" aria-describedby="chartSummary"></svg></div></div></section>

<script src="shared/dom.js?v=20260902b"></script><script src="shared/chart-core.js?v=20260902b"></script><script src="shared/set-config.js?v=20260902b"></script><script src="shared/oda-payload.js?v=20260902b"></script><script src="shared/oda-model.js?v=20260902b"></script><script src="shared/oda-ui.js?v=20260902b"></script>
<script>
(async()=>{'use strict';
  window.CGD_READY = false;const{element,svgEl}=window.CGDDom,C=window.CGDCore,P=window.ODAPayload,M=window.ODAModel,UI=window.ODAUI;const root=document.getElementById('vizRoot'),chartArea=document.getElementById('chartArea');let payload;
  try{payload=await P.load();}catch(error){P.renderFailState(chartArea,error); window.CGD_READY = true;return;}
  const years=M.displayYears(payload),state=UI.createState({scenario:'S1',measure:'gross',year:2028,recipient:'ALL',sector:'120',unit:'usd',hiddenIncome:''},{onChange:scheduleRender});
  const sectorSelect=element('select',{className:'plain-select'}),recipientSelect=element('select',{className:'plain-select'});sectorSelect.append(element('option',{text:'All sectors',attributes:{value:'ALL'}}));M.sectorsAlphabetical(payload).forEach(code=>sectorSelect.append(element('option',{text:M.sectorShortName(payload,code),attributes:{value:code}})));recipientSelect.append(element('option',{text:'All recipients',attributes:{value:'ALL'}}));payload.axes.recipient.slice().sort((a,b)=>payload.recipientName(a).localeCompare(payload.recipientName(b))).forEach(iso=>recipientSelect.append(element('option',{text:payload.recipientName(iso),attributes:{value:iso}})));
  sectorSelect.value=state.get().sector;recipientSelect.value=state.get().recipient;
  function syncAllOptions(s){sectorSelect.value=s.sector;recipientSelect.value=s.recipient;sectorSelect.querySelector('option[value="ALL"]').disabled=s.recipient==='ALL';recipientSelect.querySelector('option[value="ALL"]').disabled=s.sector==='ALL';}
  sectorSelect.addEventListener('change',()=>state.set({sector:sectorSelect.value}));recipientSelect.addEventListener('change',()=>state.set({recipient:recipientSelect.value}));state.subscribe(syncAllOptions);syncAllOptions(state.get());
  document.getElementById('controls').append(UI.scenarioSelect(state),UI.yearControl(state,years),UI.measureToggle(state,()=> 'usd'),UI.controlGroup('Sector',sectorSelect,{id:'sectorSelect'}),UI.controlGroup('Recipient',recipientSelect,{id:'recipientSelect'}));
  async function ensure(s){await payload.blobs(M.seriesBlobNames('recipient_sector',s));}
  function rows(s){const list=[];if(s.recipient==='ALL'){for(const iso of payload.axes.recipient)list.push(make(iso,s.sector));}else if(s.sector==='ALL'){for(const sec of payload.axes.sector)list.push(make(s.recipient,sec));}else list.push(make(s.recipient,s.sector));return list.filter(r=>r.base>0&&Number.isFinite(r.now));function make(iso,sec){const base=M.valueAt(payload,'recipient_sector',{...s,year:2024},{recipient:iso,sector:sec}),now=M.valueAt(payload,'recipient_sector',s,{recipient:iso,sector:sec}),income=M.incomeGroup(payload,iso);return{iso,sec,name:s.recipient==='ALL'?payload.recipientName(iso):payload.sectorName(sec),recipientName:payload.recipientName(iso),sectorName:payload.sectorName(sec),income,base,now,loss:(base-now)/base};}}
  /* Two row sets, deliberately. The legend is built from every group PRESENT in
     the data, `rows`; the chart draws only the groups not switched off,
     `shownRows`. Building the legend from the drawn rows instead would drop a
     switched-off group out of the legend altogether, leaving the reader no
     control to switch it back on. */
  function shownRows(s){const hidden=UI.hiddenSet(s.hiddenIncome);const all=rows(s);
    return s.recipient==='ALL'?all.filter(r=>!hidden.has(r.income)):all;}
  const svg=document.getElementById('scatterSvg'),tooltip=document.getElementById('tooltip');let pinned=null,lastWidth=640,version=0;
  function logScale(min,max,a,b){const lo=Math.log10(min),hi=Math.log10(max);return v=>a+(Math.log10(v)-lo)/(hi-lo||1)*(b-a);}function ticks(min,max){const out=[];for(let e=Math.floor(Math.log10(min));e<=Math.ceil(Math.log10(max));e++){const v=10**e;if(v>=min*.8&&v<=max*1.2)out.push(v);}return out;}
  function showTip(r,target){tooltip.replaceChildren(element('strong',{text:r.recipientName}),element('div',{text:r.sectorName}),element('div',{text:`2024: ${M.usd(r.base)}`}),element('div',{text:`${state.get().year}: ${M.usd(r.now)}`}),element('div',{text:`Change: ${r.loss>=0?'−':'+'}${M.percent(Math.abs(r.loss),{decimals:1})}`}),element('div',{text:`Income group: ${r.income}`}));tooltip.hidden=false;const b=target.getBoundingClientRect(),rb=root.getBoundingClientRect();tooltip.style.left=`${Math.min(rb.width-tooltip.offsetWidth-8,Math.max(8,b.left-rb.left+8))}px`;tooltip.style.top=`${b.bottom-rb.top+4}px`;}
  function render(width){const s=state.get(),data=shownRows(s),layout=C.getLayout(width),margin={...layout.margin,left:Math.max(54,layout.margin.left),top:34,bottom:46},height=Math.max(310,Math.min(470,width*.63)),pw=width-margin.left-margin.right,ph=height-margin.top-margin.bottom;svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('height',height);if(!data.length){const t=svgEl('text',{x:width/2,y:height/2,'text-anchor':'middle',class:'axis'});t.textContent='No positive 2024 baseline values under these settings.';svg.append(t);update(data,s);window.CGD_READY=true;return;}
    const xs=data.map(r=>r.base),yMin=Math.min(-.1,...data.map(r=>r.loss)),yMax=Math.max(.1,...data.map(r=>r.loss)),xMin=Math.min(...xs)*.8,xMax=Math.max(...xs)*1.25,x=logScale(xMin,xMax,margin.left,margin.left+pw),y=v=>margin.top+(yMax-v)/(yMax-yMin)*ph;
    for(const q of [yMin,0,yMax]){svg.append(svgEl('line',{x1:margin.left,x2:margin.left+pw,y1:y(q),y2:y(q),class:q===0?'zero-line':'grid-line'}));const t=svgEl('text',{x:margin.left-6,y:y(q)+4,'text-anchor':'end',class:'axis'});t.textContent=`${Math.round(q*100)}%`;svg.append(t);}const xTickValues=C.thinTicks(ticks(xMin,xMax),layout.name==='compact'?3:5);for(const q of xTickValues){const first=q===xTickValues[0],last=q===xTickValues[xTickValues.length-1];const t=svgEl('text',{x:x(q),y:margin.top+ph+19,'text-anchor':first?'start':last?'end':'middle',class:'axis'});t.textContent=q<1?`US$${q.toFixed(q<.1?2:1)}m`:M.usd(q);svg.append(t);}
    const xt=svgEl('text',{x:margin.left+pw/2,y:height-7,'text-anchor':'middle',class:'axis-title'});xt.textContent=`2024 ${M.MEASURE_LABEL[s.measure].toLowerCase()} ODA (log scale)`;svg.append(xt);const yt=svgEl('text',{x:margin.left,y:16,class:'axis-title'});yt.textContent=`Share lost by ${s.year}`;svg.append(yt);
    data.slice().sort((a,b)=>b.base-a.base).forEach(r=>{const colour=s.recipient==='ALL'?window.CGDSet.colourFor(r.income):window.CGDSet.sectorColour(r.sec),dot=svgEl('circle',{cx:x(r.base),cy:y(r.loss),r:layout.name==='compact'?3.7:4.4,fill:colour,'fill-opacity':.78,stroke:'#fff','stroke-width':.6,tabindex:'0',role:'img','aria-label':`${r.name}, ${M.usd(r.base)} in 2024, ${M.percent(r.loss,{decimals:1})} lost`});dot.addEventListener('pointerenter',()=>showTip(r,dot));dot.addEventListener('pointerleave',()=>{if(!pinned)tooltip.hidden=true;});dot.addEventListener('focus',()=>showTip(r,dot));dot.addEventListener('blur',()=>{if(!pinned)tooltip.hidden=true;});dot.addEventListener('click',e=>{e.stopPropagation();pinned=dot;showTip(r,dot);UI.attachDismiss(tooltip,()=>{pinned=null;tooltip.hidden=true;},{returnFocusTo:dot});});svg.append(dot);});update(data,s);window.CGD_READY=true;
  }
  /* No subtitle: it restated the three controls sitting directly above it. */
  function update(data,s){UI.renderNotes('notes',{visible:[`${data.length} positive-baseline ${s.recipient==='ALL'?'recipients':'sectors'} shown.`],notes:['Cells with no 2024 baseline cannot be placed on a logarithmic axis and are not shown.',UI.STANDARD_NOTES.prices]});const legend=document.getElementById('legend');if(s.recipient==='ALL'){/* Income groups are the filter. Sector keys stay plain labels: the sector dimension is already chosen by the Sector control above, so a second way to drop sectors would be two controls for one decision (skill Sec.C-7). */const present=M.INCOME_GROUPS.filter(g=>rows(s).some(r=>r.income===g));UI.filterLegend({host:legend,keys:present,state,stateKey:'hiddenIncome',colourOf:g=>window.CGDSet.colourFor(g),tipOf:g=>`${rows(s).filter(r=>r.income===g).length} recipients.`});}else{legend.replaceChildren();for(const sec of payload.axes.sector.filter(sec=>data.some(r=>r.sec===sec))){const sw=element('span',{className:'swatch'});sw.style.background=window.CGDSet.sectorColour(sec);legend.append(element('span',{className:'legend-item'},[sw,element('span',{text:payload.sectorName(sec)})]));}}}
  let frame=null;function scheduleRender(){if(frame)cancelAnimationFrame(frame);frame=requestAnimationFrame(async()=>{frame=null;const v=++version;pinned=null;tooltip.hidden=true;try{await ensure(state.get());if(v===version)render(lastWidth);}catch(error){if(v===version)P.renderFailState(chartArea,error); window.CGD_READY = true;}});}try{await ensure(state.get());}catch(error){P.renderFailState(chartArea,error); window.CGD_READY = true;return;}C.observeInlineSize(document.getElementById('scatterWrap'),w=>{lastWidth=w;render(w);});
  document.getElementById('fullscreenBtn').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():root.requestFullscreen?.());window.ODA_F4={state,rows:()=>rows(state.get())};
})();</script><script src="shared/cgd-embed.js?v=20260902b"></script></body></html>
