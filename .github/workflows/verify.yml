name: Verify figures

# Blocks a merge when any figure fails the CGD QA gate (SKILL.md §F steps 1-3)
# at 320 / 768 / 1200px. Python port of the Node gate; see qa/verify.py.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run the QA gate
        run: python qa/verify.py

      - name: State exercise and screenshots
        run: |
          python qa/exercise_f1_f4.py
          python qa/exercise.py f5-fiscal-loss.html
          python qa/exercise_f6_f8.py
          python qa/exercise_f9_f12.py
          python qa/exercise_f13_f15.py
          python qa/exercise_f16.py
          python qa/exercise_f17.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figure-screenshots
          path: qa/shots/
          if-no-files-found: ignore
