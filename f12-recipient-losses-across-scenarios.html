(async()=>{'use strict';window.CGD_READY=false;const{element}=CGDDom,C=CGDCore,P=ODAPayload,M=ODAModel,UI=ODAUI,scenarios=Object.keys(M.SCENARIOS);let payload;try{payload=await P.load();if(!d3)throw Error('The pinned chart dependency did not load.')}catch(e){P.renderFailState(document.querySelector('.panel'),e);window.CGD_READY=true;return}const state=UI.createState({measure:'gross',metric:'pct',sort:'spread',mode:'absolute',highlight:'S1',page:0,popupMetric:'pct'},{dependents:{measure:['page'],metric:['page'],sort:['page'],mode:['page']},onChange:()=>schedule()}),opts=(pairs,value,key,onchange,wide)=>{const s=element('select',{className:wide?'plain-select oda-select-wide':'plain-select'});pairs.forEach(x=>s.append(new Option(x[1],x[0])));s.value=value;s.onchange=()=>onchange(s.value);state.subscribe(v=>s.value=v[key]);return s};const metric=opts([['pct','2028 ODA as % of 2024'],['gni','Loss as % of GNI'],['usd','US$ lost']],state.get().metric,'metric',v=>state.set({metric:v}),true),/* Comparison and Sort by take the WIDE tier, not the standard one. Their

let raw=[],shown=[],width=700,seq=0;async function ensure(s){await payload.blobs([`static/baseline_${s.measure}__recipient`,...scenarios.map(x=>`scenarios/${x}/recipient_year__${s.measure}`)])}function value(r,scenario,s){const now=r.values[scenario],v=s.metric==='pct'?now/r.base:s.metric==='usd'?r.base-now:(r.base-now)/(r.gni/1e6);if(s.mode==='absolute')return v;const ref=s.metric==='pct'?r.values.S1/r.base:s.metric==='usd'?r.base-r.values.S1:(r.base-r.values.S1)/(r.gni/1e6);return v-ref}function build(s){return payload.axes.recipient.map(iso=>{const base=M.valueAt(payload,'recipient',{...s,year:2024},{recipient:iso}),gni=Number(payload.recipientMeta[iso]?.gni_usd),values=Object.fromEntries(scenarios.map(x=>[x,M.valueAt(payload,'recipient',{...s,scenario:x,year:2028},{recipient:iso})]));return{iso,name:payload.recipientName(iso),base,gni,values}}).filter(r=>r.base>0&&scenarios.every(x=>Number.isFinite(r.values[x]))&&(s.metric!=='gni'||r.gni>0))}function compare(a,b,s){const av=scenarios.map(x=>value(a,x,s)),bv=scenarios.map(x=>value(b,x,s));if(s.sort==='volume')return b.base-a.base;if(s.sort==='spread')return(d3.max(bv)-d3.min(bv))-(d3.max(av)-d3.min(av));const loss=r=>s.metric==='pct'?1-r:s.mode==='deviation'?Math.abs(r):r;return d3.median(bv.map(loss))-d3.median(av.map(loss))}

function legend(s){const l=document.getElementById('legend');l.replaceChildren();/* The legend is the highlight control now that the dropdown is gone, so it has to

l.append(element('span',{className:'legend-title',text:'Highlight:'}));scenarios.forEach(k=>{const info=M.scenarioInfo(k),active=k===s.highlight,b=element('button',{text:k,className:active?'legend-item active':'legend-item',attributes:{type:'button','aria-pressed':String(active),'aria-label':`Highlight ${info.label}, ${info.name}. ${info.tip}`}});b.style.color=colour(k);b.onclick=()=>state.set({highlight:k});UI.hoverTip(b,()=>`${info.label} — ${info.name}. ${info.tip}`);l.append(b)})}

'Loss as share of GNI':'ODA lost, constant 2024 US$');legend(s);if(pagerGroup)pagerGroup.sync();const missing=payload.axes.recipient.length-raw.length;UI.renderNotes('notes',{visible:[missing?`${missing} of ${payload.axes.recipient.length} recipients are excluded because the required denominator or ODA value is unavailable.`:''],notes:['Row width shows the range of modelled behaviour across allocation rules, not statistical uncertainty. Very high loss-to-GNI values can occur for microstates with small GNI.',M.denominatorNote(payload,'gni'),UI.STANDARD_NOTES.prices].filter(Boolean)});}

/* The shared UI.modal, not a hand-rolled dialog. This figure carried its own

   close button, so its 'x' was a different size, weight and hit area from the
   one in every other drill-down in the set. UI.modal also brings the focus

async function openPopup(rec,s){const dialog=UI.modal(rec.name,{host:document.getElementById('popupHost'),returnFocusTo:document.activeElement});
  const body=element('div'),metricSelect=element('select',{className:'plain-select'});
  metricSelect.append(new Option('% of 2024','pct'),new Option('US$ lost','usd'));
  metricSelect.value=s.metric==='usd'?'usd':'pct';
  dialog.card.append(UI.controlGroup('Sector metric',metricSelect,{id:'popupMetric'}),body);
  body.textContent='Loading sector detail…';try{await payload.blobs([`static/baseline_${s.measure}__recipient_sector`,...scenarios.map(x=>`scenarios/${x}/recipient_sector_year__${s.measure}`)]);const sectors=M.sectorsAlphabetical(payload).map(sec=>{const base=M.valueAt(payload,'recipient_sector',{...s,year:2024},{recipient:rec.iso,sector:sec}),values=Object.fromEntries(scenarios.map(k=>[k,M.valueAt(payload,'recipient_sector',{...s,scenario:k,year:2028},{recipient:rec.iso,sector:sec})]));return{sec,base,values}}).filter(r=>r.base>0);function render(){const pm=metricSelect.value;body.replaceChildren();
    /* ONE domain across every sector, so the strips are comparable with each

       sixty-point spread look identical, which is the opposite of the point. */
    const all=sectors.flatMap(r=>scenarios.map(k=>pm==='usd'?r.base-r.values[k]:r.values[k]/r.base)).filter(Number.isFinite),
          ext=d3.extent(all),span=(ext[1]-ext[0])||1,pos=v=>((v-ext[0])/span)*100,
          fmtPop=v=>pm==='usd'?M.usd(v):M.percent(v);
    body.append(element('div',{className:'oda-track-axis'},[element('span',{text:fmtPop(ext[0])}),element('span',{text:fmtPop(ext[1])})]));
    sectors.forEach(r=>{const vals=scenarios.map(k=>pm==='usd'?r.base-r.values[k]:r.values[k]/r.base),strip=element('div',{className:'strip'});
      scenarios.forEach((k,i)=>{const dot=element('i');dot.style.left=`calc(${Math.max(0,Math.min(100,pos(vals[i])))}% - 4px)`;dot.style.background=colour(k);dot.style.opacity=k===s.highlight?'1':'.45';/* The popup's dots carried a `title`, which is why the drill-down felt like it
