  async function schedule(){const n=++seq, s={...state.get()};tooltip.hidden=true;try{const rows=await buildData(s);if(n!==seq)return;draw(rows,s,lastWidth);}catch(error){if(n===seq)P.renderFailState(chartArea,error); window.CGD_READY = true;}}
