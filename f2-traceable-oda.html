<!doctype html>
<html lang="en" data-cgd-interactive-name="oda-f2-traceable-oda">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>How much of each donor's bilateral ODA can be traced to a recipient and sector?</title>
<link rel="stylesheet" href="shared/cgd-figure.css"><link rel="stylesheet" href="shared/cgd-responsive.css"><link rel="stylesheet" href="shared/oda-figure.css">
<style>
  .trace-row,.trace-head{display:grid;grid-template-columns:minmax(116px,190px) minmax(150px,1fr) 78px;gap:8px;align-items:center}.trace-head{padding:4px 5px;border-bottom:1px solid var(--cgd-border);font-size:12px;font-weight:600;color:var(--cgd-dark-gray)}
  .trace-row{min-height:32px;padding:2px 5px;border-bottom:1px solid var(--cgd-light-gray)}.trace-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trace-bar svg{display:block;width:100%;height:24px}.trace-total{text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums}.spec-head{text-align:right;white-space:normal;line-height:1.1}
  .trace-legend{display:flex;gap:8px 12px;flex-wrap:wrap;font-size:11.5px}.trace-key{display:inline-flex;align-items:center;gap:4px}.trace-swatch{width:10px;height:10px}.axis-wrap{display:grid;grid-template-columns:minmax(116px,190px) minmax(150px,1fr) 78px;gap:8px;padding:0 5px}.axis-wrap svg{width:100%;height:30px}.tooltip{position:absolute;z-index:20;max-width:275px}.tip-rule{margin-top:4px;padding-top:4px;border-top:1px solid var(--cgd-light-gray)}
  @media(max-width:520px){.trace-row,.trace-head,.axis-wrap{grid-template-columns:84px minmax(96px,1fr) 54px;gap:3px}.trace-name,.trace-total,.trace-head{font-size:11px}.trace-row{padding-inline:2px}}
</style></head>
<body><main id="vizRoot" class="viz-wrapper">
  <div class="header-row"><div class="title-block"><h1 id="vizTitle">How much of each donor's bilateral ODA can be traced to a recipient and sector?</h1><p class="viz-sub" id="vizSub">2024 gross bilateral ODA</p></div>
    <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="View fullscreen" title="View fullscreen"><svg class="icon-expand" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5" stroke="currentColor" stroke-width="1.8"/></svg><svg class="icon-compress" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" stroke="currentColor" stroke-width="1.8"/></svg></button>
  </div>
  <div class="controls" id="controls"></div>
  <section class="panel"><div class="panel-header"><div class="trace-legend" id="legend"></div></div><div class="chart-area" id="chartArea">
    <div class="trace-head"><span>Donor</span><span id="axisHeading">Gross bilateral ODA</span><span class="spec-head">Fully specified</span></div><div id="rows"></div><div class="axis-wrap"><span></span><svg id="axisSvg" aria-hidden="true"></svg><span></span></div>
  </div></section><p id="chartSummary" class="notes"></p><div id="notes"></div><div class="tooltip" id="tooltip" hidden></div>
</main>
<script src="shared/dom.js"></script><script src="shared/chart-core.js"></script><script src="shared/set-config.js"></script><script src="shared/oda-payload.js"></script><script src="shared/oda-model.js"></script><script src="shared/oda-ui.js"></script>
<script>
(async()=>{'use strict';
  window.CGD_READY = false;const{element,svgEl}=window.CGDDom,P=window.ODAPayload,M=window.ODAModel,UI=window.ODAUI;const root=document.getElementById('vizRoot'),chartArea=document.getElementById('chartArea');let payload;
  try{payload=await P.load();await payload.blobs(['static/specification_split__donor']);}catch(error){P.renderFailState(chartArea,error); window.CGD_READY = true;return;}
  /* DAC membership as the release records it; EU Institutions are classified
     outside the DAC there, so they read as a non-DAC provider. */
  const isDac=code=>Number(payload.donorMeta[code]&&payload.donorMeta[code].dac_member)===1;
  const cats=payload.axes.specification_category,catSpec={recipient_and_sector_specified:['Recipient and sector specified','#006970'],recipient_specified_sector_missing:['Recipient specified; sector missing','#2D99B5'],region_only:['Region only','#FFB52C'],wholly_unspecified:['Wholly unspecified','#394649']},pageSize=20;
  const state=UI.createState({unit:'pct',sort:'traceable',page:0},{dependents:{sort:['page']},onChange:render});
  const unitBox=element('div',{className:'segmented',attributes:{role:'group','aria-label':'Display unit'}});for(const[v,l]of[['pct','Percent'],['usd','US$ billion']]){const b=element('button',{text:l,attributes:{type:'button','data-unit':v}});b.addEventListener('click',()=>state.set({unit:v}));unitBox.append(b);}state.subscribe(s=>unitBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.unit===s.unit))));
  const sort=UI.sortSelect(state,[{value:'traceable',label:'Highest fully specified share'},{value:'unspecified',label:'Highest wholly unspecified share'},{value:'volume',label:'Largest total volume'}]);document.getElementById('controls').append(UI.controlGroup('Show',unitBox),sort);
  UI.pagerRow(document.querySelector('.panel')).append(UI.pager(state,()=>Math.ceil(payload.axes.donor.length/pageSize)));state.set({});
  const legend=document.getElementById('legend');for(const c of cats){const sw=element('span',{className:'trace-swatch'});sw.style.background=catSpec[c][1];legend.append(element('span',{className:'trace-key'},[sw,element('span',{text:catSpec[c][0]})]));}
  function allRows(){return payload.axes.donor.map(code=>{const vals=cats.map(c=>payload.at('static/specification_split__donor',{donor:code,specification_category:c})),total=vals.reduce((a,b)=>a+b,0);return{code,name:payload.donorName(code),vals,total,traceable:total?vals[0]/total:0,unspecified:total?vals[3]/total:0};});}
  function ordered(){const s=state.get(),rows=allRows();rows.sort((a,b)=>(b[s.sort==='volume'?'total':s.sort]-a[s.sort==='volume'?'total':s.sort])||a.name.localeCompare(b.name));return rows;}
  const tooltip=document.getElementById('tooltip');let pinned=null;function tip(row,i,target){const share=row.total?row.vals[i]/row.total:null;tooltip.replaceChildren(element('strong',{text:row.name}),element('div',{text:catSpec[cats[i]][0]}),element('div',{text:`${M.usd(row.vals[i])} (${M.percent(share,{decimals:1})})`}),element('div',{className:'tip-rule',text:`Total 2024 bilateral ODA: ${M.usd(row.total)}`}),element('div',{text:isDac(row.code)?'DAC member':'Non-DAC provider'}));tooltip.hidden=false;const b=target.getBoundingClientRect(),rb=root.getBoundingClientRect();tooltip.style.left=`${Math.min(rb.width-tooltip.offsetWidth-8,Math.max(8,b.left-rb.left+8))}px`;tooltip.style.top=`${b.bottom-rb.top+3}px`;}
  function render(){const s=state.get(),rows=ordered(),page=Math.min(s.page,Math.ceil(rows.length/pageSize)-1),shown=rows.slice(page*pageSize,(page+1)*pageSize),max=Math.max(...rows.map(r=>r.total));document.getElementById('rows').replaceChildren();
    for(const row of shown){const wrap=element('div',{className:'trace-row'}),name=element('div',{className:'trace-name',text:row.name,attributes:{title:row.name}}),bar=element('div',{className:'trace-bar'}),svg=svgEl('svg',{'aria-label':`${row.name} traceability split`});let x=0;
      row.vals.forEach((v,i)=>{const w=s.unit==='pct'?(row.total?v/row.total*100:0):v/max*100;if(w>0){const rect=svgEl('rect',{x:`${x}%`,width:`${w}%`,y:3,height:18,fill:catSpec[cats[i]][1],tabindex:'0',role:'img','aria-label':`${catSpec[cats[i]][0]} ${M.usd(v)}`});rect.addEventListener('pointerenter',()=>tip(row,i,rect));rect.addEventListener('pointerleave',()=>{if(!pinned)tooltip.hidden=true;});rect.addEventListener('focus',()=>tip(row,i,rect));rect.addEventListener('blur',()=>{if(!pinned)tooltip.hidden=true;});rect.addEventListener('click',e=>{e.stopPropagation();pinned=rect;tip(row,i,rect);UI.attachDismiss(tooltip,()=>{pinned=null;tooltip.hidden=true;},{returnFocusTo:rect});});svg.append(rect);}x+=w;});bar.append(svg);const total=element('div',{className:'trace-total',text:M.percent(row.traceable,{decimals:0}),attributes:{title:`${M.percent(row.traceable,{decimals:1})} of ${M.usd(row.total)} is specified to a recipient and a sector`}});wrap.append(name,bar,total);document.getElementById('rows').append(wrap);}
    document.getElementById('axisHeading').textContent=s.unit==='pct'?'Share of gross bilateral ODA':'Gross bilateral ODA, US$ billion';document.getElementById('vizSub').textContent=s.unit==='pct'?'Share of 2024 gross bilateral ODA':'Volume of 2024 gross bilateral ODA';const axis=document.getElementById('axisSvg');axis.replaceChildren();axis.removeAttribute('viewBox');const ticks=innerWidth<=520?[0,.5,1]:[0,.25,.5,.75,1];ticks.forEach(t=>{const tx=svgEl('text',{x:`${t*100}%`,y:16,dx:t===0?2:t===1?-2:0,'text-anchor':t===0?'start':t===1?'end':'middle',class:'axis'});tx.textContent=s.unit==='pct'?`${t*100}%`:M.usd(max*t,{unit:'bn'});axis.append(tx);});document.getElementById('chartSummary').textContent=`Donors ${page*pageSize+1}–${page*pageSize+shown.length} of ${rows.length}.`;window.CGD_READY=true;
  }
  document.getElementById('notes').append(UI.notes({notes:['The final column is the share of the donor\u2019s gross bilateral ODA specified to both a recipient and a sector. It does not change with the display unit.','Recipient specified but sector missing is structurally zero in the current CRS extract; the category is retained in the legend.','Earmarked multilateral contributions are counted as bilateral ODA; core multilateral contributions are not.',UI.STANDARD_NOTES.prices,UI.STANDARD_NOTES.unallocable],source:`Source: CGD analysis of 2024 CRS disbursements, ${payload.release}.`}));document.getElementById('fullscreenBtn').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():root.requestFullscreen?.());render();window.ODA_F2={state,rows:allRows};
})();</script><script src="shared/cgd-embed.js"></script></body></html>
