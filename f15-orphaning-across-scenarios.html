<!doctype html><html lang="en" data-cgd-interactive-name="oda-f15-orphaning-scenarios"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How much does donor behaviour change the risk of ‘orphaning’?</title><link rel="stylesheet" href="shared/cgd-figure.css"><link rel="stylesheet" href="shared/cgd-responsive.css"><link rel="stylesheet" href="shared/oda-figure.css"><style>

</style></head><body><main id="vizRoot" class="viz-wrapper"><div class="header-row"><div class="title-block"><h1>How much does donor behaviour change the risk of ‘orphaning’?</h1><p class="viz-sub">A recipient-sector is counted as ‘orphaned’ once total bilateral ODA to it has fallen by a high proportion versus 2024.</p></div><button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="View fullscreen" title="View fullscreen"><svg class="icon-expand" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5" stroke="currentColor" stroke-width="1.8"/></svg><svg class="icon-compress" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5" stroke="currentColor" stroke-width="1.8"/></svg></button></div><div class="controls oda-controls-five" id="controls"></div><div class="legend" id="familyLegend"></div><section class="panel"><div class="chart-area"><div class="plot-wrap"><svg id="chart" role="img" aria-label="Cumulative ‘orphaned’ recipient-sector pairs under ten allocation rules"></svg></div></div></section><p class="notes" id="summary"></p><div id="notes"></div><div class="tooltip" id="tooltip" hidden></div><div id="popupHost"></div></main>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous" referrerpolicy="no-referrer"></script><script src="shared/dom.js"></script><script src="shared/chart-core.js"></script><script src="shared/set-config.js"></script><script src="shared/oda-payload.js"></script><script src="shared/oda-model.js"></script><script src="shared/oda-ui.js"></script><script>
(async()=>{'use strict';window.CGD_READY=false;const{element}=CGDDom,C=CGDCore,P=ODAPayload,M=ODAModel,UI=ODAUI,scenarios=Object.keys(M.SCENARIOS),host=document.getElementById('popupHost');let payload;try{payload=await P.load();if(!d3)throw Error('The pinned chart dependency did not load.')}catch(e){P.renderFailState(document.querySelector('.panel'),e);window.CGD_READY=true;return}
/* Coloured by scenario family, as elsewhere in the set: donor-portfolio rules

const S1_COLOUR='#0B4C5B',DONOR_COLOUR='#5C8794',RECIPIENT_COLOUR='#FFB52C',
  lineColour=k=>k==='S1'?S1_COLOUR:(M.scenarioInfo(k).family==='donor'?DONOR_COLOUR:RECIPIENT_COLOUR);
const years=M.displayYears(payload),state=UI.createState({threshold:.5,mode:'absolute',unit:'count',income:'all',sector:'all'},{onChange:()=>schedule()}),select=(items,key,wide)=>{const s=element('select',{className:wide?'plain-select oda-select-wide':'plain-select'});items.forEach(x=>s.append(new Option(x[1],x[0])));s.value=state.get()[key];s.onchange=()=>state.set({[key]:key==='threshold'?+s.value:s.value});state.subscribe(v=>s.value=v[key]);return s},threshold=select([['0.5','50%'],['0.75','75%']],'threshold'),mode=select([['absolute','Absolute'],['deviation','Deviation from S1']],'mode',true),unit=select([['count','Count'],['pct','% of 2024 pairs']],'unit'),/* Two controls, because these are two independent questions. One dropdown

incomeItems=[['all','All income groups'],...M.INCOME_GROUPS.map(x=>[`${x}`,x])],
income=select(incomeItems,'income',true),

async function ensure(){await payload.blobs(['static/baseline_gross__recipient_sector',...scenarios.map(k=>`scenarios/${k}/recipient_sector_year__gross`)])}
function filterPair(r,s){return (s.income==='all'||r.income===s.income)&&(s.sector==='all'||String(r.sector)===String(s.sector))}
function buildPairs(){const out=[];for(const recipient of payload.axes.recipient)for(const sector of payload.axes.sector){const base=M.valueAt(payload,'recipient_sector',{scenario:'S1',measure:'gross',year:2024},{recipient,sector});if(!(base>0))continue;out.push({recipient,sector,income:M.incomeGroup(payload,recipient),base,values:Object.fromEntries(scenarios.map(k=>[k,Object.fromEntries(years.map(y=>[y,M.valueAt(payload,'recipient_sector',{scenario:k,measure:'gross',year:y},{recipient,sector})||0]))]))})}return out}
/* CUMULATIVE, per the brief and identically to F10: a pair is counted from the
   first year it crosses the threshold under that scenario and stays counted. */
function crossesAt(r,k,y,s){return (r.base-r.values[k][y])/r.base>=s.threshold}
function firstOrphanYear(r,k,s){for(const y of years)if(crossesAt(r,k,y,s))return y;return null}
function isOrphanBy(r,k,y,s){const f=firstOrphanYear(r,k,s);return f!==null&&f<=y}
function buildSeries(s){const use=pairs.filter(r=>filterPair(r,s)),denom=use.length||1,raw=scenarios.map(k=>({scenario:k,values:years.map(year=>({year,count:use.filter(r=>isOrphanBy(r,k,year,s)).length}))})),ref=raw[0];return raw.map(r=>({scenario:r.scenario,values:r.values.map((d,i)=>{let v=s.unit==='pct'?d.count/denom:d.count;if(s.mode==='deviation'){const rv=s.unit==='pct'?ref.values[i].count/denom:ref.values[i].count;v-=rv}return{year:d.year,value:v,count:d.count}})}))}
const tip=document.getElementById('tooltip');

function yearAt(event,x,svg){const px=d3.pointer(event,svg.node())[0];
  return years.reduce((a,b)=>Math.abs(x(b)-px)<Math.abs(x(a)-px)?b:a)}
function showTip(d,year,s,event,node){
  const info=M.scenarioInfo(d.scenario),point=d.values.find(v=>v.year===year)||d.values[d.values.length-1],
    ref=series[0]&&series[0].values.find(v=>v.year===year);
  tip.replaceChildren(element('strong',{text:`${info.label} — ${info.name}`}),
    element('div',{text:info.tip}),
    element('div',{className:'tip-rule',text:`${point.year}: ${point.count} pair${point.count===1?'':'s'} ‘orphaned’`}),
    element('div',{text:s.unit==='pct'?`${M.percent(point.value,{decimals:1})} of 2024 pairs`:`Cumulative count: ${M.count(point.value)}`}),
    element('div',{text:d.scenario==='S1'?'The proportional-cuts reference.'
      :ref?`S1 reference this year: ${ref.count} pairs`:''}),
    element('div',{className:'tip-rule',text:'Select for the ranked pairs.'}));
  tip.hidden=false;
  const wrap=document.querySelector('.plot-wrap').getBoundingClientRect();
  let left,top;
  if(event){left=event.clientX-wrap.left+12;top=event.clientY-wrap.top+12}
  else{const b=node.getBoundingClientRect();left=b.left-wrap.left+12;top=b.top-wrap.top+12}
  tip.style.left=`${Math.max(4,Math.min(wrap.width-tip.offsetWidth-4,left))}px`;
  tip.style.top=`${Math.max(4,Math.min(wrap.height-tip.offsetHeight-4,top))}px`;
}
function draw(s,w){series=buildSeries(s);const vals=series.flatMap(r=>r.values.map(d=>d.value)),ext=d3.extent(vals),pad=(ext[1]-ext[0]||1)*.1,h=Math.max(370,Math.min(480,w*.58)),m={top:24,right:w<520?46:72,bottom:48,left:w<430?53:65},x=d3.scalePoint(years,[m.left,w-m.right]).padding(.05),y=d3.scaleLinear([Math.min(0,ext[0]-pad),ext[1]+pad],[h-m.bottom,m.top]).nice(),line=d3.line().x(d=>x(d.year)).y(d=>y(d.value)).curve(d3.curveMonotoneX),svg=d3.select('#chart');svg.attr('viewBox',`0 0 ${w} ${h}`).attr('height',h).selectAll('*').remove();svg.append('g').attr('transform',`translate(0,${h-m.bottom})`).call(d3.axisBottom(x).tickSizeOuter(0));svg.append('g').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(y).ticks(w<430?4:6).tickFormat(v=>s.unit==='pct'?d3.format('.0%')(v):d3.format('d')(v)).tickSize(-(w-m.left-m.right))).call(g=>g.select('.domain').remove());
/* S1 is the proportional-cuts reference and is drawn heavier; the rest are
   coloured by scenario family, as elsewhere in the set. Brand tokens, not ad-hoc hex. */
const paths=svg.selectAll('path.series').data(series).join('path').attr('class','series').attr('d',d=>line(d.values)).attr('fill','none').attr('stroke',d=>lineColour(d.scenario)).attr('stroke-width',d=>d.scenario==='S1'?3:1.5).style('cursor','pointer').attr('tabindex',0).attr('role','img').attr('aria-label',d=>`${M.scenarioInfo(d.scenario).label} — ${M.scenarioInfo(d.scenario).name}. ${d.values[d.values.length-1].count} pairs ‘orphaned’ by ${years[years.length-1]}. Select for the ranked pairs.`)/* Isolating the hovered line was the whole of the interaction: the reader
   could see WHICH line they were on but not what it said at that year. The
   tooltip reports the year under the cursor, which is the year a click drills
   into. */
.on('pointerenter',(e,d)=>paths.attr('opacity',x=>x===d?1:.15))
.on('pointermove',function(e,d){showTip(d,yearAt(e,x,svg),s,e)})
.on('pointerleave',()=>{paths.attr('opacity',1);hideTip()})
.on('focus',function(e,d){paths.attr('opacity',x=>x===d?1:.15);showTip(d,years[years.length-1],s,null,this)})
.on('blur',()=>{paths.attr('opacity',1);hideTip()}).on('click',function(e,d){const px=d3.pointer(e,svg.node())[0],yr=years.reduce((a,b)=>Math.abs(x(b)-px)<Math.abs(x(a)-px)?b:a);openPairs(d.scenario,yr,s,this)}).on('keydown',function(e,d){if(e.key==='Enter'||e.key===' '){e.preventDefault();openPairs(d.scenario,years[years.length-1],s,this)}});
/* The <title> is gone: the tooltip above carries the full scenario name, and
   carries it immediately and on touch, which is what the general rules' naming
   requirement actually needs. */
const ends=series.map(r=>({scenario:r.scenario,y:y(r.values.at(-1).value)})).sort((a,b)=>a.y-b.y);
/* Labels sit at their line's OWN end value and are pushed apart only where they
   would collide. They used to be spread evenly down the whole plot height
   regardless of where the line actually finished, and each was joined back to
   its endpoint by a leader in the same grey and weight as the series — so ten
   lines appeared to plunge or soar after 2028, which is not in the data. */
const LABEL_GAP=15,topLimit=m.top+6,bottomLimit=h-m.bottom-4;
let cursor=topLimit;
ends.forEach(d=>{d.labelY=Math.max(d.y,cursor);cursor=d.labelY+LABEL_GAP;});
/* If the dodge has run past the bottom, walk back up so the stack still fits. */
const overshoot=ends.length?ends[ends.length-1].labelY-bottomLimit:0;
if(overshoot>0)for(let i=ends.length-1;i>=0;i-=1)
  ends[i].labelY=Math.min(ends[i].labelY,bottomLimit-(ends.length-1-i)*LABEL_GAP);
ends.forEach(d=>{d.labelY=Math.max(topLimit,d.labelY);d.needsLeader=Math.abs(d.labelY-d.y)>2;});
svg.selectAll('line.end-link').data(ends.filter(d=>d.needsLeader)).join('line').attr('class','end-link')
  .attr('x1',x(2028)+1).attr('x2',x(2028)+4).attr('y1',d=>d.y).attr('y2',d=>d.labelY)
  /* Hairline and dotted, so a leader can never be read as data. */
  .attr('stroke','#B7C3C5').attr('stroke-width',.75).attr('stroke-dasharray','1 2');
const endText=svg.selectAll('text.end').data(ends).join('text').attr('class','end').attr('x',x(2028)+5).attr('y',d=>d.labelY+4).attr('font-size',11).attr('fill',d=>lineColour(d.scenario)).text(d=>d.scenario);
/* The end labels read 'S1', 'S2A' and so on, and carried the full name in a
   <title> -- the same second-of-delay, no-touch tooltip the lines have just
   stopped using. They now share the figure's own tooltip, so hovering the label
   at the end of a line tells you the same thing as hovering the line. */
endText.style('cursor','help')
  .on('pointermove',function(e,d){showTip(d,years[years.length-1],s,e)})
  .on('pointerleave',()=>hideTip())
  .on('focus',function(e,d){showTip(d,years[years.length-1],s,null,this)})
  .on('blur',()=>hideTip())
  .attr('tabindex',0).attr('role','img')
  .attr('aria-label',d=>`${M.scenarioInfo(d.scenario).label} — ${M.scenarioInfo(d.scenario).name}`);
svg.append('text').attr('class','axis-title').attr('x',(m.left+w-m.right)/2).attr('y',h-5).attr('text-anchor','middle').text('Year');svg.append('text').attr('class','axis-title').attr('x',m.left).attr('y',14).text(s.unit==='pct'?'Orphaned pairs, cumulative (% of 2024 pairs)':'Orphaned pairs (cumulative count)');document.getElementById('summary').textContent=`${pairs.filter(r=>filterPair(r,s)).length} recipient-sector pairs are in the selected 2024 denominator. Hover or focus a line to isolate it; select one for the ranked pairs.`;window.CGD_READY=true}
function openPairs(sc,year,s,trigger){const list=pairs.filter(r=>filterPair(r,s)&&isOrphanBy(r,sc,year,s)).map(r=>({recipient:r.recipient,sector:r.sector,ratio:r.values[sc][year]/r.base,base:r.base,lost:r.base-r.values[sc][year]})).sort((a,b)=>a.ratio-b.ratio);
/* The same shared drill-down F10 uses, so the behaviour is identical in both. */
UI.orphanDrilldown({payload,host,title:`${M.scenarioInfo(sc).label} — ${M.scenarioInfo(sc).name}: pairs ‘orphaned’ by ${year}`,pairs:list,scenario:sc,year,returnFocusTo:trigger})}
async function schedule(){window.CGD_READY=false;const n=++seq,s={...state.get()};try{await ensure();if(n!==seq)return;if(!pairs.length)pairs=buildPairs();draw(s,width)}catch(e){if(n===seq){P.renderFailState(document.querySelector('.panel'),e);window.CGD_READY=true}}}
document.getElementById('notes').append(UI.notes({notes:[
 'The count is cumulative: a pair is counted from the first year it crosses the threshold under that allocation rule, and stays counted in later years even if support partially recovers.',
 'Shares are of the 2,562 recipient-sector pairs with positive bilateral ODA in 2024.',
 UI.STANDARD_NOTES.prices
].filter(Boolean).filter(Boolean)}));
C.observeInlineSize(document.querySelector('.plot-wrap'),w=>{width=w;schedule()});document.getElementById('fullscreenBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.getElementById('vizRoot').requestFullscreen?.();window.ODA_F15={state,series:()=>series,pairs:()=>pairs,firstOrphanYear};})();
</script><script src="shared/cgd-embed.js"></script></body></html>
